<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Том II: Одуванчики — Дмитрий Ильин. Литературный проект «Театр теней»</title>
  <link rel="icon" href="/images/51.png" type="image/png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: #050505;
      color: #e0d5b0;
      font-family: 'Georgia', 'Times New Roman', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* ОСНОВНОЙ КОНТЕЙНЕР ПОСТЕРА */
    .poster-container {
      position: relative;
      width: 100vw;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ПРЯМАЯ КАРТИНКА-ПОСТЕР */
    .poster-img {
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    /* ВЕРХНЯЯ НАВИГАЦИЯ (ВЕРХНИЙ ЛЕВЫЙ УГОЛ) */
    .top-bar {
      position: absolute;
      top: 1.5rem;
      left: 2rem;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .home-link {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: #C5A059;
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      transition: all 0.3s ease;
      filter: drop-shadow(0 0 6px rgba(0, 0, 0, 0.9));
    }

    .home-link:hover {
      color: #f0d59e;
      filter: drop-shadow(0 0 8px rgba(197, 160, 89, 0.6));
    }

    .flask-icon {
      width: 22px;
      height: auto;
    }

    /* ССЫЛКА НА ЗА КУЛИСАМИ */
    .behind-link {
      color: #8A7E6B;
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      transition: all 0.3s ease;
      filter: drop-shadow(0 0 6px rgba(0, 0, 0, 0.9));
    }

    .behind-link:hover {
      color: #C5A059;
      filter: drop-shadow(0 0 8px rgba(197, 160, 89, 0.6));
    }

    /* НИЖНИЙ БЛОК: КНОПКА "ВХОД" + УВЕЛИЧЕННАЯ КОЛБА */
    .bottom-action-container {
      position: absolute;
      bottom: 10%; /* Привязано над нижней рамкой */
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      z-index: 999;
    }

    .enter-btn {
      display: inline-block;
      text-decoration: none;
      background: rgba(10, 9, 7, 0.92);
      border: 1.5px solid #C5A059;
      color: #C5A059;
      padding: 0.5rem 1.8rem;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      transition: all 0.35s ease;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
    }

    .enter-btn:hover {
      background: #C5A059;
      color: #050505;
      box-shadow: 0 0 20px rgba(197, 160, 89, 0.6);
    }

    /* КЛИКАБЕЛЬНЫЙ УВЕЛИЧЕННЫЙ ЛОГОТИП КОЛБЫ colba00.png */
    .flask-click-link {
      display: inline-block;
      text-decoration: none;
      outline: none;
      cursor: pointer;
    }

    .bottom-flask-img {
      width: 85px;
      height: auto;
      display: block;
      filter: drop-shadow(0 0 10px rgba(197, 160, 89, 0.45));
      transition: all 0.35s ease;
    }

    .flask-click-link:hover .bottom-flask-img {
      filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.95));
      transform: scale(1.08);
    }

    @media (max-width: 768px) {
      .top-bar { top: 1rem; left: 1rem; gap: 1rem; }
      .bottom-action-container { bottom: 8%; }
      .bottom-flask-img { width: 65px; }
      .home-link span, .behind-link { font-size: 0.7rem; }
    }
  </style>
</head>
<body>

  <div class="poster-container">

    <!-- ВЕРХНЯЯ НАВИГАЦИЯ -->
    <header class="top-bar">
      <a href="/index.html" class="home-link" title="Вернуться в Фойе Театра">
        <img src="/images/colba main bright2.png" alt="Колба" class="flask-icon">
        <span>Театр теней</span>
      </a>
      <a href="/behind/" class="behind-link" title="За кулисами проекта">За кулисами</a>
    </header>

    <!-- ПОСТЕР -->
    <img src="/tom2/images/tom02.png" alt="Том II: Одуванчики" class="poster-img">

    <!-- НИЖНИЙ БЛОК: КНОПКА "ВХОД" И УВЕЛИЧЕННАЯ КОЛБА colba00.png -->
    <div class="bottom-action-container">
      <a href="/tom2/reader.html" class="enter-btn">ВХОД</a>
      
      <a href="/tom2/reader.html" class="flask-click-link" title="Войти в читалку Тома II">
        <img src="/tom2/images/colba00.png" alt="Вход в читалку" class="bottom-flask-img">
      </a>
    </div>

  </div>

</body>
</html>
