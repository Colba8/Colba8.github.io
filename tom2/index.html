<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Том II: Одуванчики — Дмитрий Ильин. Литературный проект «Театр теней»</title>
  <link rel="icon" href="../images/51.png" type="image/png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #050505;
      color: #e0d5b0;
      font-family: 'Georgia', 'Times New Roman', serif;
      overflow: hidden;
    }

    /* ПОЛНОЦЕННЫЙ ПОСТЕР tom02.png БЕЗ НАЛОЖЕНИЙ ТЕКСТА */
    .poster-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #050505 url('images/tom02.png') center center / contain no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem;
    }

    /* КНОПКА ВОЗВРАТА В ФОЙЕ (ВЕРХНИЙ ЛЕВЫЙ УГОЛ) */
    .top-bar {
      position: absolute;
      top: 1.5rem;
      left: 2rem;
      z-index: 10;
    }

    .home-link {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: #C5A059;
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      transition: all 0.3s ease;
      filter: drop-shadow(0 0 6px rgba(0, 0, 0, 0.9));
    }

    .home-link:hover {
      color: #f0d59e;
      filter: drop-shadow(0 0 8px rgba(197, 160, 89, 0.6));
    }

    .flask-icon {
      width: 22px;
      height: auto;
    }

    /* НЕБОЛЬШАЯ КНОПКА "ВХОД" НАД ГОРЛЫШКОМ КОЛБЫ (ВНИЗУ ПО ЦЕНТРУ) */
    .bottom-enter-container {
      position: absolute;
      bottom: 11.5%; /* Ровно над горлышком нарисованной колбы */
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    .enter-btn {
      display: inline-block;
      text-decoration: none;
      background: rgba(10, 9, 7, 0.92);
      border: 1.5px solid #C5A059;
      color: #C5A059;
      padding: 0.5rem 1.8rem;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      transition: all 0.35s ease;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
    }

    .enter-btn:hover {
      background: #C5A059;
      color: #050505;
      box-shadow: 0 0 20px rgba(197, 160, 89, 0.6);
    }

    @media (max-width: 768px) {
      .poster-wrapper { background-size: cover; }
      .top-bar { top: 1rem; left: 1rem; }
      .bottom-enter-container { bottom: 10%; }
    }
  </style>
</head>
<body>

  <div class="poster-wrapper">

    <!-- ВОЗВРАТ В ФОЙЕ -->
    <header class="top-bar">
      <a href="../index.html" class="home-link" title="Вернуться в Фойе Театра">
        <img src="../images/colba main bright2.png" alt="Колба" class="flask-icon">
        <span>Театр теней</span>
      </a>
    </header>

    <!-- НЕБОЛЬШАЯ КНОПКА "ВХОД" НАД ГОРЛЫШКОМ КОЛБЫ -->
    <div class="bottom-enter-container">
      <a href="reader.html" class="enter-btn">ВХОД</a>
    </div>

  </div>

</body>
</html>
