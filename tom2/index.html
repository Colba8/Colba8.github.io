<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Том II: Одуванчики — Дмитрий Ильин. Литературный проект «Театр теней»</title>
  <link rel="icon" href="/images/51.png" type="image/png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: #050505;
      color: #e0d5b0;
      font-family: 'Georgia', 'Times New Roman', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    .poster-container {
      position: relative;
      width: 100vw;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .poster-img {
      max-width: 90vw;
      max-height: 85vh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    /* ЦЕНТРАЛЬНОЕ МЕНЮ НАВИГАЦИИ */
    .top-nav {
      position: absolute;
      top: 1.5rem;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 2.5rem;
      z-index: 100;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .top-nav a {
      color: #C5A059;
      text-decoration: none;
      transition: color 0.3s ease;
      padding: 0.5rem 1rem;
    }

    .top-nav a:hover {
      color: #f0d59e;
    }

    /* НИЖНИЙ БЛОК: КНОПКА "ВХОД" + КОЛБА */
    .bottom-action-container {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      z-index: 999;
    }

    .enter-btn {
      display: inline-block;
      text-decoration: none;
      background: rgba(10, 9, 7, 0.92);
      border: 1.5px solid #C5A059;
      color: #C5A059;
      padding: 0.5rem 1.8rem;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      transition: all 0.35s ease;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
    }

    .enter-btn:hover {
      background: #C5A059;
      color: #050505;
      box-shadow: 0 0 20px rgba(197, 160, 89, 0.6);
    }

    .flask-click-link {
      display: inline-block;
      text-decoration: none;
      outline: none;
      cursor: pointer;
    }

    .bottom-flask-img {
      width: 85px;
      height: auto;
      display: block;
      filter: drop-shadow(0 0 10px rgba(197, 160, 89, 0.45));
      transition: all 0.35s ease;
    }

    .flask-click-link:hover .bottom-flask-img {
      filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.95));
      transform: scale(1.08);
    }

    @media (max-width: 768px) {
      .top-nav { 
        top: 1rem; 
        gap: 1.2rem;
        font-size: 0.7rem;
      }
      .bottom-action-container { bottom: 8%; }
      .bottom-flask-img { width: 65px; }
    }
  </style>
</head>
<body>

  <div class="poster-container">

    <!-- ЦЕНТРАЛЬНОЕ МЕНЮ НАВИГАЦИИ -->
    <nav class="top-nav">
      <a href="/index.html">Главная</a>
      <a href="/tom1/index.html">Второй звонок</a>
      <a href="/tom2/index.html">Одуванчики</a>
      <a href="/behind/index.html">За кулисами</a>
      <a href="/cooperation.html">Сотрудничество</a>
      <a href="/contacts.html">Контакты</a>
    </nav>

    <!-- ПОСТЕР -->
    <img src="/tom2/images/tom02.png" alt="Том II: Одуванчики" class="poster-img">

    <!-- НИЖНИЙ БЛОК: КНОПКА "ВХОД" И КОЛБА -->
    <div class="bottom-action-container">
      <a href="/tom2/reader.html" class="enter-btn">ВХОД</a>
      
      <a href="/tom2/reader.html" class="flask-click-link" title="Войти в читалку Тома II">
        <img src="/tom2/images/colba00.png" alt="Вход в читалку" class="bottom-flask-img">
      </a>
    </div>

  </div>

</body>
</html>
