<style>

body{

}

.backdrop {

}

::-webkit-scrollbar { width: 6px; height: 6px; }

.top-navbar {

.nav-logo { display: flex; align-items: center; line-height: 0; }

.main-layout { display: flex; margin-top: 60px; }

.sidebar {

}
.sb-title {

  font-size: 1.2rem; margin-bottom: 1.5rem; padding-bottom: 0.5rem;
  border-bottom: 1px solid rgba(201, 169, 110, 0.2);
}
.sb-item {

.content {

}
.content-inner {
  max-width: 720px;
  width: 92%;
  background: #0b0a08;
  padding: 3rem 3.5rem;
  box-shadow: 0 0 80px #000;
  border: 1px solid rgba(201, 169, 110, 0.1);
}

.header-plate {
  max-width: 100%; height: auto; display: block;
  margin: 0 auto 3rem auto;
  border: 1px solid rgba(201, 169, 110, 0.3);
  box-shadow: 0 10px 30px rgba(0,0,0,0.8);
}

.prologue-title {
  font-family: 'Oranienbaum', serif; color: #C9A96E;
  font-size: 2rem; text-align: center; margin: 2rem 0 2.5rem 0;
  text-transform: uppercase; letter-spacing: 0.1em;
  scroll-margin-top: 80px;
}

.chapter-date, .chapter-location {
  font-weight: bold;
  font-style: italic;
  color: #e0d5b0;
  font-size: 1.25rem;
  text-align: left;
  padding: 0;
  line-height: 1.55;
  text-indent: 0 !important;
  scroll-margin-top: 80px;
}

.chapter-date {
  margin: 3rem 0 0 0;
}

.chapter-location {
  margin: 0 0 2.5rem 0;
}

.novel-text, .chapter-body p, .synopsis p {
  font-size: 1.25rem;
  line-height: 1.55;
  margin-bottom: 2.4rem;
  font-weight: 300;
  text-align: left;
  text-indent: 0 !important;
  hyphens: auto;
  word-break: break-word;
  color: #e0d5b0;
}

.synopsis { font-style: italic; }

.first-paragraph::first-letter {
  font-size: 3.8rem;
  float: left;
  line-height: 0.8;
  margin-right: 0.6rem;
  margin-top: 0.1rem;
  color: #C9A96E;
  font-family: 'Oranienbaum', serif;
  font-weight: normal;
}

.translation { color: #8A7E6B; font-style: normal; font-size: 1.1rem; }
.translation::before { content: '['; }
.translation::after { content: ']'; }

.foreign { font-style: italic; color: #e0d5b0; }

.img-inline, img {
  max-width: 100%; height: auto; margin: 2.5rem auto; display: block;
  border: 1px solid rgba(201, 169, 110, 0.2);
  box-shadow: 0 10px 30px rgba(0,0,0,0.8);
}

.document {
  background: #e4dcc4 !important; color: #1a1713 !important;
  font-family: 'Courier Prime', 'Courier New', monospace !important;
  font-weight: bold !important; padding: 2.5rem; margin: 2.5rem 0;
  border-left: 5px solid #C9A96E;
  box-shadow: 0 5px 15px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.8);
  border-radius: 2px;
}
.document p {
  color: #1a1713 !important; font-family: 'Courier Prime', 'Courier New', monospace !important;
  font-weight: bold !important; font-size: 1.1rem !important;
  line-height: 1.5 !important; text-indent: 0 !important;
  text-align: left !important; margin-bottom: 1.2rem; letter-spacing: -0.02em;
}
.document h2, .document h3 {
  color: #1a1713 !important;
  font-family: 'Courier Prime', 'Courier New', monospace !important;
  font-weight: bold !important;
  font-size: 1.2rem !important;
  text-align: center !important;
  letter-spacing: 0.05em !important;
  margin: 0 0 1.5rem 0 !important;
  line-height: 1.4 !important;
  text-indent: 0 !important;
}

.letter-box {
  background: rgba(180,205,230,0.08); border: 1px solid rgba(180,205,230,0.3);
  padding: 2rem 2.2rem; margin: 2.2rem 0; position: relative;
}
.letter-box p {
  font-family: 'Marck Script', cursive; font-size: 1.45rem; line-height: 1.5;
  color: #E8F0FE; margin-bottom: 0.9rem; text-align: left; text-indent: 0 !important;
}
.letter-box h3 {
  color: #E8F0FE; font-size: 1.1rem; letter-spacing: 0.08em; margin-bottom: 1rem;
  text-transform: uppercase; font-family: 'Oranienbaum', serif;
}

.historical-note {
  margin-top: 4rem; padding-top: 2rem; border-top: 1px solid rgba(201, 169, 110, 0.2);
}
.historical-note h2 {
  font-family: 'Oranienbaum', serif; color: #C9A96E;
  font-size: 1.6rem; text-align: center; margin-bottom: 2rem; letter-spacing: 0.08em;
}
.historical-note h3 {
  font-family: 'Oranienbaum', serif; color: #C9A96E;
  font-size: 1.2rem; margin: 2rem 0 1rem 0;
}
.historical-note p {
  font-size: 1.15rem; line-height: 1.55; margin-bottom: 1.5rem; color: #e0d5b0;
}

.copyright {
  margin-top: 5rem; padding-top: 2.5rem;
  border-top: 1px solid rgba(201, 169, 110, 0.15); text-align: center;
}
.copyright p {
  color: #C9A96E; font-size: 1rem; line-height: 1.7; letter-spacing: 0.04em;
  margin-bottom: 2.5rem; text-align: center; text-indent: 0 !important;
}
.copyright-flask {
  display: block; margin: 0 auto; width: 160px; height: auto;
  border: none; box-shadow: none; background: transparent; opacity: 0.9;
}

.reader-controls {
  position: fixed; bottom: 2rem; right: 2rem;
  display: flex; gap: 0.6rem; z-index: 1000;
}
.btn-control {
  background: rgba(0,0,0,0.85); border: 1px solid #C9A96E; color: #C9A96E;
  font-family: inherit; font-size: 0.75rem; letter-spacing: 0.15em;
  padding: 0.5rem 1rem; cursor: pointer; transition: all .3s;
}
.btn-control:hover { background: #C9A96E; color: #0b0a08; }
#bm-status {
  position: fixed; bottom: 2.5rem; right: 14rem;
  font-size: 0.75rem; color: #8A7E6B; letter-spacing: 0.1em;
}

.load-error { color: #a05555; border: 1px dashed #a05555; padding: 0.8rem; margin: 1rem 0; }

@media(max-width: 950px) {
  .sidebar { display: none; }
  .content { margin-left: 0; }
  .content-inner { padding: 1.5rem 1.2rem; width: 100%; max-width: 100%; }
  .document { padding: 1.5rem; }
  .novel-text, .chapter-body p, .synopsis p { font-size: 1.1rem; text-align: left; text-indent: 0 !important; }
  .reader-controls { bottom: 1rem; right: 1rem; }
  #bm-status { right: auto; left: 1rem; bottom: 1.5rem; }
  .top-navbar { gap: 0.8rem; }
  .nav-link { font-size: 0.65rem; }
  .nav-logo img { height: 30px; }
  .nav-divider { height: 20px; }
  .copyright-flask { width: 120px; }
  .chapter-date, .chapter-location { font-size: 1.1rem; }
}
</style>
</head>
<body>

<div class="backdrop"></div>

<!-- ИСПРАВЛЕННОЕ ВЕРХНЕЕ МЕНЮ -->
<nav class="top-navbar">
  <a href="/index.html" class="nav-logo" title="Главная страница">
    <img src="/tom2/images/colba00.png" alt="Театр теней">
  </a>
  <span class="nav-divider"></span>
  <a href="/index.html" class="nav-link">Главная</a>
  <a href="/tom1/index.html" class="nav-link">Второй звонок</a>
  <a href="/tom2/index.html" class="nav-link active">Одуванчики</a>
  <a href="/behind/index.html" class="nav-link">За кулисами</a>
  <a href="/cooperation.html" class="nav-link">Сотрудничество</a>
  <a href="/contacts.html" class="nav-link">Контакты</a>
</nav>

<div class="main-layout">
  <aside class="sidebar">
    <div class="sb-title">Одуванчики</div>
    <ul class="sb-list" id="toc"></ul>
  </aside>

  <main class="content">
    <article class="content-inner">
      
      <img src="/tom2/images/plate00.png" alt="Одуванчики. Том II" class="header-plate">
      
      <div id="book"></div>

      <div class="copyright">
        <p>
          Авторские права на произведение охраняются законом Российской Федерации.<br>
          Единый номер депонирования литературного произведения в реестре: 226061100096.
        </p>
        <img src="/tom2/images/00.png" alt="Колба" class="copyright-flask">
      </div>

    </article>
  </main>
</div>

<div class="reader-controls">
  <span id="bm-status"></span>
  <button class="btn-control" onclick="saveBookmark()">🔖 Закладка</button>
  <button class="btn-control" onclick="goToBookmark()">📍 К закладке</button>
</div>

<script>
var FILES = [
  'chapters/01.html', 'chapters/02.html', 'chapters/03.html', 'chapters/04.html',
  'chapters/05.html', 'chapters/06.html', 'chapters/07.html', 'chapters/08.html',
  'chapters/09.html', 'chapters/10.html', 'chapters/11.html', 'chapters/12.html',
  'chapters/13.html', 'chapters/14.html', 'chapters/15.html', 'chapters/16.html',
  'chapters/17.html', 'chapters/18.html', 'chapters/19.html', 'chapters/20.html',
  'chapters/21.html', 'chapters/22.html', 'chapters/23.html', 'chapters/24.html',
  'chapters/25.html', 'chapters/26.html', 'chapters/27.html', 'chapters/28.html',
  'chapters/29.html', 'chapters/30.html', 'chapters/31.html', 'chapters/32.html',
  'chapters/33.html', 'chapters/34.html', 'chapters/35.html', 'chapters/36.html',
  'chapters/37.html', 'chapters/38.html', 'chapters/39.html', 'chapters/40.html',
  'chapters/41.html', 'chapters/42.html', 'chapters/43.html', 'chapters/44.html'
];

(function () {
  var book = document.getElementById('book');
  var toc = document.getElementById('toc');
  var i = 0;
  
  function next() {
    if (i >= FILES.length) return;
    var f = FILES[i]; i++;
    
    fetch(f).then(function (r) {
      if (!r.ok) throw new Error(f);
      return r.text();
    }).then(function (html) {
      html = html.replace(/^\ufeff?---[\s\S]*?---\s*\n/, '');
      html = html.replace(/(?:\.\.\/)?images\//g, '/tom2/images/');
      
      var section = document.createElement('section');
      section.id = 'ch-' + (i - 1);
      section.style.marginBottom = '4rem';
      section.style.scrollMarginTop = '80px';

      var div = document.createElement('div');
      div.className = 'chapter-body';
      div.innerHTML = html;
      
      section.appendChild(div);
      book.appendChild(section);
      
      // Автоматически собираем заголовок из содержимого главы
      var dateEl = div.querySelector('h2.chapter-date');
      var locEl = div.querySelector('p.chapter-location');
      var title = '';
      if (dateEl) title = dateEl.textContent.trim();
      if (locEl) {
        var loc = locEl.textContent.trim();
        if (title && loc && title !== loc) {
          title = title + ', ' + loc;
        } else if (!title && loc) {
          title = loc;
        }
      }
      if (!title) title = 'Глава ' + i;
      
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.className = 'sb-item';
      a.href = '#ch-' + (i - 1);
      a.textContent = title;
      
      a.onclick = function(e) {
        e.preventDefault();
        document.querySelectorAll('.sb-item').forEach(function(x){x.classList.remove('active')});
        a.classList.add('active');
        
        var targetId = a.getAttribute('href').substring(1);
        var target = document.getElementById(targetId);
        if (target) {
          var offset = target.offsetTop - 80;
          window.scrollTo({ top: offset, behavior: 'smooth' });
        }
      };
      
      li.appendChild(a);
      toc.appendChild(li);
      
      next();
    }).catch(function () {
      var p = document.createElement('p');
      p.className = 'load-error';
      p.textContent = 'Файл не загрузился: ' + f;
      book.appendChild(p);
      next();
    });
  }
  
  next();
})();

function saveBookmark() {
  localStorage.setItem('tom2_bm', String(window.scrollY));
  document.getElementById('bm-status').textContent = 'закладка сохранена';
  setTimeout(function(){document.getElementById('bm-status').textContent=''}, 2000);
}

function goToBookmark() {
  var y = parseInt(localStorage.getItem('tom2_bm') || '0', 10);
  window.scrollTo({ top: y, behavior: 'smooth' });
}
</script>

</body>
</html>
