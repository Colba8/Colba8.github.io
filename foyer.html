<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Театр теней | Фойе</title>
  <link rel="icon" href="images/51.png" type="image/png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #050505;
      color: #e0d5b0;
      font-family: 'Georgia', 'Times New Roman', serif;
      min-height: 100vh;
    }

    /* ВСПОМОГАТЕЛЬНЫЕ ОКОШКИ — СВЕРХУ */
    .top-navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 60px;
      background: #000000;
      border-bottom: 1px solid rgba(201,169,110,0.15);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.8rem;
      z-index: 150;
    }
    .nav-link {
      color: #8A7E6B;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      transition: color 0.3s;
      cursor: pointer;
      background: transparent;
      border: none;
      outline: none;
    }
    .nav-link:hover { color: #C9A96E; }

    /* ПОСТЕР ФОЙЕ */
    .foyer-stage {
      position: relative;
      max-width: 1200px;
      margin: 80px auto 3rem;
    }
    .foyer-stage img { display: block; width: 100%; height: auto; }

    /* ПЛАНКА, ЗАКРЫВАЮЩАЯ ЧУЖУЮ СТРОКУ ВНУТРИ КАРТИНКИ */
    .stage-cover {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 8%;
      background: #050505;
      z-index: 2;
      pointer-events: none;
    }

    /* ДВЕРИ — МЯГКОЕ СИЯНИЕ БЕЗ РАМКИ И БЕЗ ПОДСКАЗОК */
    .door {
      position: absolute;
      cursor: pointer;
      z-index: 3;
      transition: box-shadow 0.4s ease, background 0.4s ease;
    }
    .door:hover {
      background: rgba(201,169,110,0.05);
      box-shadow: 0 0 30px rgba(201,169,110,0.28), inset 0 0 18px rgba(201,169,110,0.12);
    }
    #door-tom1 { left: 10.5%; top: 68%; width: 24.5%; height: 22%; }
    #door-tom2 { left: 65%;   top: 68%; width: 24.5%; height: 22%; }

    /* МОДАЛЬНОЕ ОКНО КОНТАКТОВ */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.9);
      display: none; align-items: center; justify-content: center; z-index: 200;
    }
    .modal-card {
      background: #0b0a08; border: 1px solid #C9A96E; padding: 2.5rem;
      max-width: 450px; width: 90%; position: relative;
    }
    .modal-close {
      position: absolute; top: 1rem; right: 1rem;
      background: transparent; border: none; color: #8A7E6B; font-size: 1.5rem; cursor: pointer;
    }
    .modal-card h2 { color: #C9A96E; text-align: center; margin-bottom: 1rem; }

    @media (max-width: 900px) {
      .top-navbar { gap: 0.8rem; }
      .nav-link { font-size: 0.65rem; }
    }
  </style>
</head>
<body>

  <nav class="top-navbar">
    <a href="materials.html" class="nav-link">Архив</a>
    <a href="laboratory.html" class="nav-link">За кулисами</a>
    <a href="foreigners.html" class="nav-link">Сотрудничество</a>
    <button class="nav-link" onclick="document.getElementById('contactModal').style.display='flex'">Контакты</button>
  </nav>

  <div class="foyer-stage">
    <img src="tom2/images/tom00.png" alt="Театр теней — две истории, один мир">
    <div class="stage-cover"></div>
    <a class="door" id="door-tom1" href="reader.html" aria-label="Том I — Второй звонок"></a>
    <a class="door" id="door-tom2" href="tom2/reader.html" aria-label="Том II — Одуванчики"></a>
  </div>

  <div class="modal-overlay" id="contactModal">
    <div class="modal-card">
      <button class="modal-close" onclick="document.getElementById('contactModal').style.display='none'">✕</button>
      <h2>Контакты</h2>
      <form style="display:flex; flex-direction:column; gap:1rem;" action="https://formspree.io/f/mgojzbba" method="POST">
        <input type="text" name="name" placeholder="Ваш позывной" required style="background:#161512; border:1px solid #333; color:#e0d5b0; padding:0.8rem; font-family:inherit;">
        <input type="email" name="email" placeholder="Ваша почта" required style="background:#161512; border:1px solid #333; color:#e0d5b0; padding:0.8rem; font-family:inherit;">
        <textarea name="message" placeholder="Сообщение" required style="background:#161512; border:1px solid #333; color:#e0d5b0; padding:0.8rem; min-height:80px; font-family:inherit;"></textarea>
        <button type="submit" style="background:transparent; border:1px solid #C9A96E; color:#C9A96E; padding:0.8rem; cursor:pointer; text-transform:uppercase; font-family:inherit; font-weight:600;">Отправить</button>
      </form>
    </div>
  </div>

</body>
</html>
