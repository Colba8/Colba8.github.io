<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>За кулисами — Галерея</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #060504;
      color: #d0c29d;
      font-family: 'Times New Roman', Times, Georgia, serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem 0;
      overflow-x: hidden;
    }

    .archive-wrapper {
      position: relative;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Аккуратная навигация над изображением, чтобы ничего не перекрывалось */
    .top-nav {
      width: 100%;
      background: linear-gradient(180deg, rgba(10, 8, 6, 0.95) 0%, rgba(6, 5, 4, 0.8) 100%);
      padding: 0.8rem 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2.5rem;
      border-bottom: 1px solid rgba(201, 169, 110, 0.2);
      margin-bottom: 0.5rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .top-nav a {
      color: #c9a96e;
      text-decoration: none;
      transition: all 0.3s ease;
      padding: 0.3rem 0.6rem;
    }

    .top-nav a:hover {
      color: #e8d5a3;
      text-shadow: 0 0 10px rgba(232, 213, 163, 0.4);
    }

    .archive-img-container {
      position: relative;
      width: 100%;
    }

    .archive-img {
      width: 100%;
      height: auto;
      display: block;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.95);
    }

    /* ==========================================
       ПОЗИЦИОНИРОВАНИЕ НА СЦЕНЕ (МЕЖДУ ШТОР)
       ========================================== */
    .stage-gallery {
      position: absolute;
      top: 55%;  /* Позиционирование ровно под табличкой «ГАЛЕРЕЯ» */
      left: 17%;
      width: 66%;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 10;
    }

    .character-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 18%;
    }

    .img-frame {
      width: 100%;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      border: 1px solid #3a3125;
      background-color: #0d0c0a;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
    }

    .img-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      filter: sepia(10%) contrast(105%);
      transition: filter 0.3s ease;
    }

    .character-card:hover .img-frame img {
      filter: sepia(0%) contrast(110%);
    }

    .character-name {
      margin-top: 0.5rem;
      font-size: 0.95rem;
      letter-spacing: 0.1em;
      color: #e8d5a3;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
    }

    /* ==========================================
       СЕКЦИЯ ВТОРОСТЕПЕННЫХ ПЕРСОНАЖЕЙ
       ========================================== */
    .secondary-section {
      margin-top: 3rem;
      padding: 0 2rem;
    }

    .section-title {
      text-align: center;
      font-size: 1.2rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #c9a96e;
      border-bottom: 1px solid rgba(201, 169, 110, 0.2);
      padding-bottom: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .secondary-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 1.2rem;
      row-gap: 2rem;
    }

    .secondary-card {
      width: 100%;
    }

    .secondary-card .character-name {
      font-size: 0.85rem;
      color: #b0a283;
    }
  </style>
</head>
