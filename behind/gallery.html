<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>За кулисами — Галерея</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #060504;
      color: #d0c29d;
      font-family: 'Times New Roman', Times, Georgia, serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 0;
      overflow-x: hidden;
    }

    .archive-wrapper {
      position: relative;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }

    .archive-img {
      width: 100%;
      height: auto;
      display: block;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.95);
    }

    .top-nav {
      position: absolute;
      top: -4%;
      left: 0;
      right: 0;
      height: 4%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2rem;
      z-index: 20;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .top-nav a {
      color: #c9a96e;
      text-decoration: none;
      transition: color 0.3s ease;
      padding: 0.5rem 1rem;
    }

    .top-nav a:hover {
      color: #e8d5a3;
    }

    /* ==========================================
       СТИЛИ ГАЛЕРЕИ ПЕРСОНАЖЕЙ
       ========================================== */
    .gallery-container {
      padding: 2rem 2rem 4rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 3.5rem;
    }

    .section-title {
      text-align: center;
      font-size: 1.4rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #c9a96e;
      border-bottom: 1px solid rgba(201, 169, 110, 0.25);
      padding-bottom: 0.5rem;
      margin-bottom: 1.5rem;
    }

    /* --- Главные герои в одну линию --- */
    .main-characters {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1.25rem;
      align-items: start;
    }

    .character-card {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Контейнер рамки с одинаковым кадрированием */
    .img-frame {
      width: 100%;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      background-color: #11100e;
      border: 1px solid #2a241e;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    .img-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 35%; /* Фокус на глазах */
      display: block;
      filter: sepia(15%) contrast(105%);
      transition: transform 0.4s ease, filter 0.4s ease;
    }

    .character-card:hover .img-frame img {
      filter: sepia(0%) contrast(110%);
    }

    .character-name {
      margin-top: 0.8rem;
      font-size: 1.1rem;
      letter-spacing: 0.1em;
      color: #e8d5a3;
      text-align: center;
    }

    /* --- Масштабирование голов главных персонажей --- */
    /* Коррекция размера голов для создания одинаковой крупности */
    .scale-maya { transform: scale(1.00); }
    .scale-aleks { transform: scale(0.84); }
    .scale-april { transform: scale(0.88); }
    .scale-olga  { transform: scale(0.95); }
    .scale-marta { transform: scale(0.98); }

    /* --- Второстепенные персонажи (2 ряда) --- */
    .secondary-characters {
      display: grid;
      grid-template-columns: repeat(6, 1fr); /* 6 колонок для размещения до 12 персонажей в 2 ряда */
      gap: 1rem;
      row-gap: 2rem;
    }

    .secondary-card .img-frame {
      aspect-ratio: 3 / 4;
      border-color: #1e1a15;
    }

    .secondary-card .character-name {
      font-size: 0.95rem;
      color: #b0a283;
    }

    /* Адаптивность для небольших экранов */
    @media (max-width: 1024px) {
      .main-characters {
        grid-template-columns: repeat(3, 1fr);
        gap: 1.5rem;
      }
      .secondary-characters {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (max-width: 600px) {
      .main-characters {
        grid-template-columns: repeat(2, 1fr);
      }
      .secondary-characters {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
