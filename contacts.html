<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты — Дмитрий Ильин. Литературный проект «Театр теней»</title>
  <link rel="icon" href="images/51.png" type="image/png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #e0d5b0;
      font-family: 'Georgia', 'Times New Roman', serif;
      overflow-x: hidden;
    }

    /* ЕДИНЫЙ ЧЕРНЫЙ ФОН СЦЕНЫ */
    .scene-wrapper {
      position: relative;
      width: 100%;
      min-height: 100vh;
      background: #000000 url('images/Contacts00.png') center center / contain no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
    }

    /* БРЕНДИНГ ВВЕРХУ СЛЕВА */
    .brand-header {
      position: absolute;
      top: 2rem;
      left: 2.5rem;
      z-index: 10;
    }

    .brand-link {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      color: #D4AF37;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      transition: all 0.3s ease;
      filter: drop-shadow(0 0 6px rgba(0, 0, 0, 0.9));
    }

    .brand-link:hover {
      color: #F3E5AB;
      filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.8));
    }

    .brand-flask-img {
      width: 28px;
      height: auto;
    }

    /* АБСОЛЮТНО ПРОЗРАЧНАЯ ФОРМА (БЕЗ СЕРЫХ КВАДРАТОВ И ПОДЛОЖЕК) */
    .contact-card {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 400px;
      margin-top: 2rem;
      background: transparent; /* Никакого собственного фона */
      border: none;
      padding: 0;
      box-shadow: none;
    }

    .form-group-list {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    /* ПОЛЯ ВВОДА — ПРОЗРАЧНЫЕ С ЧЕТКОЙ ЗОЛОТОЙ РАМКОЙ */
    .form-field {
      background: rgba(0, 0, 0, 0.6); /* Легкое затемнение только для читаемости текста */
      border: 1px solid rgba(197, 160, 89, 0.5);
      color: #F0E6D2;
      padding: 0.95rem 1.1rem;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
      caret-color: #C5A059;
    }

    .form-field:focus {
      border-color: #D4AF37;
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
      background: rgba(0, 0, 0, 0.85);
    }

    .form-field::placeholder {
      color: #a0937a;
      font-style: italic;
    }

    textarea.form-field {
      min-height: 110px;
      resize: none;
    }

    /* КНОПКА ОТПРАВИТЬ В ЕДИНОМ СТИЛЕ */
    .submit-button-container {
      margin-top: 0.5rem;
    }

    .btn-art-deco {
      width: 100%;
      background: #000000;
      border: 1.5px solid #C5A059;
      color: #C5A059;
      padding: 1rem 1.5rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      transition: all 0.4s ease;
    }

    .btn-flask-icon {
      width: 20px;
      height: auto;
      filter: drop-shadow(0 0 3px rgba(197, 160, 89, 0.5));
      transition: transform 0.3s ease;
    }

    .btn-art-deco:hover {
      background: #C5A059;
      color: #000000;
      border-color: #F3E5AB;
      box-shadow: 0 0 25px rgba(197, 160, 89, 0.6);
    }

    .btn-art-deco:hover .btn-flask-icon {
      filter: brightness(0.1);
      transform: scale(1.15);
    }

    @media (max-width: 768px) {
      .scene-wrapper { padding: 1.5rem 1rem; background-size: cover; }
      .brand-header { top: 1rem; left: 1rem; }
      .contact-card { max-width: 90%; }
    }
  </style>
</head>
<body>

  <div class="scene-wrapper">

    <!-- БРЕНДИНГ ВВЕРХУ СЛЕВА -->
    <header class="brand-header">
      <a href="index.html" class="brand-link" title="Вернуться в Фойе Театра">
        <img src="images/colba main bright2.png" alt="Колба" class="brand-flask-img">
        <span>Театр теней</span>
      </a>
    </header>

    <!-- ФОРМА (ПРОЗРАЧНАЯ) -->
    <main class="contact-card">
      <form action="https://formspree.io/f/mgojzbba" method="POST" class="form-group-list">
        <input type="text" name="name" class="form-field" placeholder="Ваше имя" required autocomplete="off">
        <input type="email" name="email" class="form-field" placeholder="Ваш e-mail" required autocomplete="off">
        <textarea name="message" class="form-field" placeholder="Ваше сообщение" required></textarea>
        
        <div class="submit-button-container">
          <button type="submit" class="btn-art-deco">
            <img src="images/colba main bright2.png" alt="" class="btn-flask-icon">
            <span>Отправить</span>
          </button>
        </div>
      </form>
    </main>

  </div>

</body>
</html>
