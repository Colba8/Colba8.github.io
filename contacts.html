<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты — Дмитрий Ильин. Литературный проект «Театр теней»</title>
  <link rel="icon" href="images/51.png" type="image/png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #050505;
      color: #e0d5b0;
      font-family: 'Georgia', 'Times New Roman', serif;
      overflow-x: hidden;
    }

    /* КАРТИНКА Contacts00.png НА 100% ЧИСТАЯ, БЕЗ ЗАТЕМНЯЮЩИХ ОВЕРЛЕЕВ */
    .scene-wrapper {
      position: relative;
      width: 100%;
      min-height: 100vh;
      background: #050505 url('images/Contacts00.png') center center / contain no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
    }

    /* БРЕНДИНГ ВВЕРХУ СЛЕВА */
    .brand-header {
      position: absolute;
      top: 2rem;
      left: 2.5rem;
      z-index: 10;
    }

    .brand-link {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      color: #D4AF37;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      transition: all 0.3s ease;
      filter: drop-shadow(0 0 6px rgba(0, 0, 0, 0.9));
    }

    .brand-link:hover {
      color: #F3E5AB;
      filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.8));
    }

    .brand-flask-img {
      width: 28px;
      height: auto;
    }

    /* АР-ДЕКО КАРТОЧКА ФОРМЫ */
    .contact-card {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 440px;
      margin-top: 2.5rem;
      background: rgba(10, 9, 7, 0.88);
      border: 1px solid #C5A059;
      padding: 2.2rem 1.8rem;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(3px);
    }

    /* ЗОЛОТЫЕ УГОЛКИ */
    .corner-decor {
      position: absolute;
      width: 12px;
      height: 12px;
      border: 2px solid #C5A059;
    }
    .c-tl { top: -4px; left: -4px; border-right: none; border-bottom: none; }
    .c-tr { top: -4px; right: -4px; border-left: none; border-bottom: none; }
    .c-bl { bottom: -4px; left: -4px; border-right: none; border-top: none; }
    .c-br { bottom: -4px; right: -4px; border-left: none; border-top: none; }

    .art-deco-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #C5A059;
      margin-bottom: 1.2rem;
    }

    .art-deco-divider::before,
    .art-deco-divider::after {
      content: '';
      display: block;
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #C5A059, transparent);
    }

    .form-group-list {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    /* ПОЛЯ ВВОДА И ЗОЛОТОЙ КУРСОР */
    .form-field {
      background: rgba(18, 16, 13, 0.95);
      border: 1px solid rgba(197, 160, 89, 0.4);
      color: #F0E6D2;
      padding: 0.95rem 1.1rem;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
      caret-color: #C5A059;
    }

    .form-field:focus {
      border-color: #D4AF37;
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.35);
      background: #161410;
    }

    .form-field::placeholder {
      color: #a0937a;
      font-style: italic;
    }

    textarea.form-field {
      min-height: 110px;
      resize: none;
    }

    /* ЕДИНАЯ КНОПКА ОТПРАВИТЬ */
    .submit-button-container {
      margin-top: 0.8rem;
    }

    .btn-art-deco {
      width: 100%;
      background: rgba(10, 9, 7, 0.95);
      border: 1.5px solid #C5A059;
      color: #C5A059;
      padding: 1rem 1.5rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      transition: all 0.4s ease;
    }

    .btn-flask-icon {
      width: 20px;
      height: auto;
      filter: drop-shadow(0 0 3px rgba(197, 160, 89, 0.5));
      transition: transform 0.3s ease;
    }

    .btn-art-deco:hover {
      background: #C5A059;
      color: #050505;
      border-color: #F3E5AB;
      box-shadow: 0 0 25px rgba(197, 160, 89, 0.6);
    }

    .btn-art-deco:hover .btn-flask-icon {
      filter: brightness(0.1);
      transform: scale(1.15);
    }

    @media (max-width: 768px) {
      .scene-wrapper { padding: 1.5rem 1rem; background-size: cover; }
      .brand-header { top: 1rem; left: 1rem; }
      .contact-card { padding: 1.5rem 1rem; }
    }
  </style>
</head>
<body>

  <div class="scene-wrapper">

    <!-- БРЕНДИНГ ВВЕРХУ СЛЕВА -->
    <header class="brand-header">
      <a href="index.html" class="brand-link" title="Вернуться в Фойе Театра">
        <img src="images/colba main bright2.png" alt="Колба" class="brand-flask-img">
        <span>Театр теней</span>
      </a>
    </header>

    <!-- ФОРМА СВЯЗИ -->
    <main class="contact-card">
      <div class="corner-decor c-tl"></div>
      <div class="corner-decor c-tr"></div>
      <div class="corner-decor c-bl"></div>
      <div class="corner-decor c-br"></div>

      <div class="art-deco-divider">◆</div>

      <form action="https://formspree.io/f/mgojzbba" method="POST" class="form-group-list">
        <input type="text" name="name" class="form-field" placeholder="Ваше имя" required autocomplete="off">
        <input type="email" name="email" class="form-field" placeholder="Ваш e-mail" required autocomplete="off">
        <textarea name="message" class="form-field" placeholder="Ваше сообщение" required></textarea>
        
        <div class="submit-button-container">
          <button type="submit" class="btn-art-deco">
            <img src="images/colba main bright2.png" alt="" class="btn-flask-icon">
            <span>Отправить</span>
          </button>
        </div>
      </form>
    </main>

  </div>

</body>
</html>
