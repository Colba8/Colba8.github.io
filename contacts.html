<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты — Дмитрий Ильин. Литературный проект «Театр теней»</title>
  <link rel="icon" href="images/51.png" type="image/png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: #000000;
      color: #e0d5b0;
      font-family: 'Georgia', 'Times New Roman', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      position: relative;
    }

    /* ССЫЛКА ВОЗВРАТА В ФОЙЕ (ВЕРХНИЙ ЛЕВЫЙ УГОЛ) */
    .brand-header {
      position: absolute;
      top: 2rem;
      left: 2.5rem;
      z-index: 10;
    }

    .brand-link {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      color: #D4AF37;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }

    .brand-link:hover {
      color: #F3E5AB;
      filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.8));
    }

    .brand-flask-img {
      width: 28px;
      height: auto;
    }

    /* ОСНОВНОЙ БЛОК СТРАНИЦЫ */
    .contact-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 5;
    }

    /* ПРОЗРАЧНЫЙ ГЕРБ «КОНТАКТЫ» */
    .contacts-banner-img {
      width: 100%;
      max-width: 380px;
      height: auto;
      display: block;
      margin-bottom: 2rem;
      filter: drop-shadow(0 0 12px rgba(197, 160, 89, 0.2));
    }

    /* ФОРМА СВЯЗИ */
    .contact-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    /* ПОЛЯ ВВОДА — НА ЧИСТОМ ЧЕРНОМ ФОНЕ С ЗОЛОТОЙ РАМКОЙ */
    .form-field {
      background: #000000;
      border: 1px solid rgba(197, 160, 89, 0.5);
      color: #F0E6D2;
      padding: 1rem 1.2rem;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
      caret-color: #C5A059; /* Золотой курсор */
    }

    .form-field:focus {
      border-color: #D4AF37;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.35);
    }

    .form-field::placeholder {
      color: #8c8068;
      font-style: italic;
    }

    textarea.form-field {
      min-height: 120px;
      resize: none; /* Без уголка ресайза */
    }

    /* ЕДИНАЯ КНОПКА ОТПРАВИТЬ */
    .btn-art-deco {
      width: 100%;
      background: #000000;
      border: 1.5px solid #C5A059;
      color: #C5A059;
      padding: 1.05rem 1.5rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      transition: all 0.4s ease;
      margin-top: 0.4rem;
    }

    .btn-flask-icon {
      width: 20px;
      height: auto;
      filter: drop-shadow(0 0 4px rgba(197, 160, 89, 0.5));
      transition: transform 0.3s ease;
    }

    .btn-art-deco:hover {
      background: #C5A059;
      color: #000000;
      border-color: #F3E5AB;
      box-shadow: 0 0 25px rgba(197, 160, 89, 0.6);
    }

    .btn-art-deco:hover .btn-flask-icon {
      filter: brightness(0.1);
      transform: scale(1.15);
    }

    @media (max-width: 600px) {
      .brand-header { top: 1.2rem; left: 1.2rem; }
      .contact-container { max-width: 90%; }
      .contacts-banner-img { max-width: 300px; }
    }
  </style>
</head>
<body>

  <!-- ВЕРХНИЙ ЛЕВЫЙ УГОЛ: ВОЗВРАТ В ФОЙЕ -->
  <header class="brand-header">
    <a href="index.html" class="brand-link" title="Вернуться в Фойе Театра">
      <img src="images/colba main bright2.png" alt="Колба" class="brand-flask-img">
      <span>Театр теней</span>
    </a>
  </header>

  <!-- ОСНОВНАЯ ФОРМА КОНТАКТОВ -->
  <main class="contact-container">
    
    <!-- ПРОЗРАЧНЫЙ ЗОЛОТОЙ ГЕРБ «КОНТАКТЫ» -->
    <img src="images/contacts01.png" alt="Контакты" class="contacts-banner-img">

    <!-- ФОРМА СВЯЗИ -->
    <form action="https://formspree.io/f/mgojzbba" method="POST" class="contact-form">
      <input type="text" name="name" class="form-field" placeholder="Ваше имя" required autocomplete="off">
      <input type="email" name="email" class="form-field" placeholder="Ваш e-mail" required autocomplete="off">
      <textarea name="message" class="form-field" placeholder="Ваше сообщение" required></textarea>
      
      <button type="submit" class="btn-art-deco">
        <img src="images/colba main bright2.png" alt="" class="btn-flask-icon">
        <span>Отправить</span>
      </button>
    </form>

  </main>

</body>
</html>
