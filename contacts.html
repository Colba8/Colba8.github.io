layout: null
---
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты — Дмитрий Ильин. Литературный проект «Театр теней»</title>
  <link rel="icon" href="images/51.png" type="image/png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #050505;
      color: #e0d5b0;
      font-family: 'Georgia', 'Times New Roman', serif;
      overflow-x: hidden;
    }

    /* ФОНОВАЯ СЦЕНА С РАДИАЛЬНОЙ ЧИСТКОЙ ШУМА И "КОПОТИ" */
    .scene-wrapper {
      position: relative;
      width: 100%;
      min-height: 100vh;
      background: #050505 url('images/Contacts00.png') center center / contain no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 3rem 1.5rem;
    }

    /* МЯГКОЕ РАСТВОРЕНИЕ ЖЕСТКИХ КРАЕВ КАРТИНКИ В ЧИСТЫЙ ЧЕРНЫЙ ФОН */
    .scene-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(5,5,5,0.4) 0%, rgba(5,5,5,0.85) 75%, #050505 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* 1. БРЕНДИНГ ВВЕРХУ СЛЕВА */
    .brand-header {
      position: absolute;
      top: 2rem;
      left: 2.5rem;
      z-index: 10;
    }

    .brand-link {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      color: #D4AF37;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      transition: all 0.3s ease;
      filter: drop-shadow(0 0 4px rgba(212, 175, 55, 0.3));
    }

    .brand-link:hover {
      color: #F3E5AB;
      filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.7));
    }

    .brand-flask-img {
      width: 28px;
      height: auto;
    }

    /* 2 & 4. АР-ДЕКО КАРТОЧКА ФОРМЫ */
    .contact-card {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 460px;
      margin-top: 2rem;
      background: rgba(12, 11, 9, 0.94);
      border: 1px solid #C5A059;
      padding: 2.5rem 2rem;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.95), inset 0 0 1px #C5A059;
      backdrop-filter: blur(6px);
    }

    /* ДЕКОРАТИВНЫЕ ЗОЛОТЫЕ УГОЛКИ */
    .corner-decor {
      position: absolute;
      width: 12px;
      height: 12px;
      border: 2px solid #C5A059;
    }
    .c-tl { top: -4px; left: -4px; border-right: none; border-bottom: none; }
    .c-tr { top: -4px; right: -4px; border-left: none; border-bottom: none; }
    .c-bl { bottom: -4px; left: -4px; border-right: none; border-top: none; }
    .c-br { bottom: -4px; right: -4px; border-left: none; border-top: none; }

    /* ОРНАМЕНТ И РАЗДЕЛИТЕЛИ */
    .art-deco-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #C5A059;
      margin-bottom: 1.5rem;
    }

    .art-deco-divider::before,
    .art-deco-divider::after {
      content: '';
      display: block;
      width: 50px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #C5A059, transparent);
    }

    .form-group-list {
      display: flex;
      flex-direction: column;
      gap: 1.3rem;
    }

    /* ПОЛЯ ВВОДА И КУРСОР */
    .form-field {
      background: #12100d;
      border: 1px solid rgba(197, 160, 89, 0.35);
      color: #F0E6D2;
      padding: 1rem 1.2rem;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
      /* ЗОЛОТОЙ КУРСОР ВВОДА */
      caret-color: #C5A059;
    }

    .form-field:focus {
      border-color: #D4AF37;
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.3);
      background: #161410;
    }

    .form-field::placeholder {
      color: #a0937a;
      font-style: italic;
    }

    /* ПОЛЕ СООБЩЕНИЯ (УБРАН УГОЛОК РЕСАЙЗА) */
    textarea.form-field {
      min-height: 120px;
      resize: none;
    }

    /* 5 & 6. ЕДИНАЯ ПРЕМИАЛЬНАЯ КНОПКА ОТПРАВИТЬ */
    .submit-button-container {
      margin-top: 1rem;
    }

    .btn-art-deco {
      width: 100%;
      background: linear-gradient(180deg, rgba(20, 18, 14, 0.95) 0%, rgba(10, 9, 7, 0.95) 100%);
      border: 1.5px solid #C5A059;
      color: #C5A059;
      padding: 1.1rem 1.5rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.35em;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      transition: all 0.4s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .btn-flask-icon {
      width: 20px;
      height: auto;
      filter: drop-shadow(0 0 3px rgba(197, 160, 89, 0.5));
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .btn-art-deco:hover {
      background: #C5A059;
      color: #050505;
      border-color: #F3E5AB;
      box-shadow: 0 0 25px rgba(197, 160, 89, 0.6);
    }

    .btn-art-deco:hover .btn-flask-icon {
      filter: brightness(0.1);
      transform: scale(1.15);
    }

    /* МОБИЛЬНАЯ АДАПТАЦИЯ */
    @media (max-width: 768px) {
      .scene-wrapper { padding: 2rem 1rem; background-size: cover; }
      .brand-header { top: 1.2rem; left: 1.2rem; }
      .contact-card { padding: 1.8rem 1.2rem; }
      .btn-art-deco { letter-spacing: 0.25em; }
    }
  </style>
</head>
<body>

  <div class="scene-wrapper">
    <div class="scene-overlay"></div>

    <!-- 1. ШАПКА ВВЕРХУ СЛЕВА -->
    <header class="brand-header">
      <a href="index.html" class="brand-link" title="Вернуться в Фойе Театра">
        <img src="images/colba main bright2.png" alt="Колба" class="brand-flask-img">
        <span>Театр теней</span>
      </a>
    </header>

    <!-- 2, 3, 4, 5. ФОРМА СВЯЗИ В СТИЛЕ АР-ДЕКО -->
    <main class="contact-card">
      <div class="corner-decor c-tl"></div>
      <div class="corner-decor c-tr"></div>
      <div class="corner-decor c-bl"></div>
      <div class="corner-decor c-br"></div>

      <div class="art-deco-divider">◆</div>

      <form action="https://formspree.io/f/mgojzbba" method="POST" class="form-group-list">
        <input type="text" name="name" class="form-field" placeholder="Ваше имя" required autocomplete="off">
        <input type="email" name="email" class="form-field" placeholder="Ваш e-mail" required autocomplete="off">
        <textarea name="message" class="form-field" placeholder="Ваше сообщение" required></textarea>
        
        <div class="submit-button-container">
          <button type="submit" class="btn-art-deco">
            <img src="images/colba main bright2.png" alt="" class="btn-flask-icon">
            <span>Отправить</span>
          </button>
        </div>
      </form>
    </main>

  </div>

</body>
</html>
