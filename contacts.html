<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты — Дмитрий Ильин. Литературный проект «Театр теней»</title>
  <link rel="icon" href="images/51.png" type="image/png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #050505;
      color: #e0d5b0;
      font-family: 'Georgia', 'Times New Roman', serif;
    }

    /* ФОНОВАЯ СЦЕНА С КАРТИНКОЙ Contacts00.png */
    .contacts-wrapper {
      position: relative;
      width: 100%;
      min-height: 100vh;
      background: #050505 url('images/Contacts00.png') center center / contain no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
    }

    /* ВОЗВРАТ В ФОЙЕ (ВЕРХНИЙ ЛЕВЫЙ УГОЛ) */
    .top-bar {
      position: absolute;
      top: 1.5rem;
      left: 2rem;
      z-index: 10;
    }

    .home-link {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: #C5A059;
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }

    .home-link:hover {
      color: #f0d59e;
      filter: drop-shadow(0 0 8px rgba(197, 160, 89, 0.6));
    }

    .flask-icon {
      width: 24px;
      height: auto;
    }

    /* ФОРМА (ВПИСАНА В ТЕМНЫЙ ЦЕНТР КАРТИНКИ) */
    .contact-form-container {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 420px;
      margin-top: 1.5rem;
      padding: 1rem;
    }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    .form-input, .form-textarea {
      background: rgba(18, 17, 14, 0.95);
      border: 1px solid rgba(197, 160, 89, 0.4);
      color: #e0d5b0;
      padding: 0.9rem 1.1rem;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-input:focus, .form-textarea:focus {
      border-color: #C5A059;
      box-shadow: 0 0 12px rgba(197, 160, 89, 0.35);
      background: #181612;
    }

    .form-input::placeholder, .form-textarea::placeholder {
      color: #7a705f;
    }

    .form-textarea {
      min-height: 110px;
      resize: vertical;
    }

    /* КНОПКА ОТПРАВИТЬ */
    .submit-btn {
      width: 100%;
      background: rgba(10, 10, 8, 0.95);
      border: 1.5px solid #C5A059;
      color: #C5A059;
      padding: 0.9rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      margin-top: 0.2rem;
    }

    .submit-btn:hover {
      background: #C5A059;
      color: #050505;
      box-shadow: 0 0 20px rgba(197, 160, 89, 0.5);
    }

    /* ИНТЕРАКТИВНАЯ КОЛБА ВНИЗУ */
    .flask-submit-trigger {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 1rem;
      background: transparent;
      border: none;
      cursor: pointer;
      outline: none;
      width: 100%;
    }

    .flask-submit-img {
      width: 52px;
      height: auto;
      filter: drop-shadow(0 0 6px rgba(197, 160, 89, 0.3));
      transition: all 0.4s ease;
    }

    .flask-submit-trigger:hover .flask-submit-img {
      filter: drop-shadow(0 0 18px rgba(212, 175, 55, 0.9));
      transform: scale(1.08);
    }

    @media (max-width: 768px) {
      .contacts-wrapper { background-size: cover; }
      .top-bar { top: 1rem; left: 1rem; }
      .contact-form-container { max-width: 90%; }
    }
  </style>
</head>
<body>

  <div class="contacts-wrapper">

    <!-- ВОЗВРАТ В ФОЙЕ -->
    <header class="top-bar">
      <a href="index.html" class="home-link" title="Вернуться в Фойе">
        <img src="images/colba main bright2.png" alt="Колба" class="flask-icon">
        <span>Театр теней</span>
      </a>
    </header>

    <!-- ФОРМА СВЯЗИ В ЦЕНТРЕ КАРТИНКИ -->
    <main class="contact-form-container">
      <form id="contactForm" class="contact-form" action="https://formspree.io/f/mgojzbba" method="POST">
        <input type="text" name="name" class="form-input" placeholder="Ваше имя" required>
        <input type="email" name="email" class="form-input" placeholder="Ваш e-mail" required>
        <textarea name="message" class="form-textarea" placeholder="Ваше сообщение" required></textarea>
        
        <button type="submit" class="submit-btn">Отправить</button>
      </form>

      <!-- ИНТЕРАКТИВНАЯ КОЛБА-КНОПКА -->
      <button type="submit" form="contactForm" class="flask-submit-trigger" title="Нажмите на Колбу для отправки">
        <img src="images/colba main bright2.png" alt="Отправить через Колбу" class="flask-submit-img">
      </button>
    </main>

  </div>

</body>
</html>
