  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #050505;
      color: #e0d5b0;
      font-family: 'Georgia', 'Times New Roman', serif;
      padding-top: 80px;
      padding-left: 2rem;
      padding-right: 2rem;
      max-width: 800px;
      margin: 0 auto;
      line-height: 1.8;
    }
    .top-navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 60px;
      background: #000000;
      border-bottom: 1px solid rgba(201, 169, 110, 0.15);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.8rem;
      z-index: 150;
    }
    .nav-link {
      color: #8A7E6B;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      transition: color 0.3s;
      cursor: pointer;
      background: transparent;
      border: none;
      outline: none;
    }
    .nav-link:hover { color: #C9A96E; }
    .nav-link.active { color: #C9A96E; }
    .back-link {
      color: #C9A96E;
      text-decoration: none;
      font-size: 0.9rem;
      display: block;
      margin-bottom: 2rem;
    }
    .back-link:hover { text-decoration: underline; }
    h1 { color: #C9A96E; margin-bottom: 2rem; }
    ul { list-style: none; padding: 0; }
    li { margin-bottom: 0.8rem; }
    a { color: #C9A96E; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.9);
      display: none; align-items: center; justify-content: center; z-index: 200;
    }
    .modal-card {
      background: #0b0a08; border: 1px solid #C9A96E; padding: 2.5rem;
      max-width: 450px; width: 90%; position: relative;
    }
    .modal-close {
      position: absolute; top: 1rem; right: 1rem;
      background: transparent; border: none; color: #8A7E6B; font-size: 1.5rem; cursor: pointer;
    }
    .modal-card h2 { color: #C9A96E; text-align: center; margin-bottom: 1rem; }
    @media(max-width: 900px) {
      .top-navbar { gap: 0.8rem; }
      .nav-link { font-size: 0.65rem; }

  <nav class="top-navbar">
    <a href="/index.html" class="nav-link">Главная</a>

      <form style="display:flex; flex-direction:column; gap:1rem;" action="https://formspree.io/f/mgojzbba" method="POST">
        <input type="text" name="name" placeholder="Ваш позывной" required style="background:#161512; border:1px solid #333; color:#e0d5b0; padding:0.8rem; font-family:inherit;">
        <input type="email" name="email" placeholder="Ваша почта" required style="background:#161512; border:1px solid #333; color:#e0d5b0; padding:0.8rem; font-family:inherit;">
        <textarea name="message" placeholder="Сообщение" required style="background:#161512; border:1px solid #333; color:#e0d5b0; padding:0.8rem; min-height:80px; font-family:inherit;"></textarea>
        <button type="submit" style="background:transparent; border:1px solid #C9A96E; color:#C9A96E; padding:0.8rem; cursor:pointer; text-transform:uppercase; font-family:inherit; font-weight:600;">Отправить</button>
