---
layout: null
---
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Второй звонок — Читальный зал</title>
  
  <link rel="icon" href="images/51.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Literatta:opsz,wght@6..72,300;6..72,400;6..72,500;6..72,600;6..72,700&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    
    body {
      background: #0a0a09 url('images/68.png') no-repeat center center fixed;
      background-size: cover;
      color: #e0d5b0;
      font-family: 'Literatta', Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.6;
    }

    /* ВЕРХНЯЯ ПАНЕЛЬ НАВИГАЦИИ */
    .top-navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 60px;
      background: #000000;
      border-bottom: 1px solid rgba(201, 169, 110, 0.15);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.8rem;
      z-index: 150;
    }

    .nav-link {
      color: #8A7E6B;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      transition: color 0.3s;
      cursor: pointer;
      background: transparent;
      border: none;
    }

    .nav-link:hover, .nav-link.active { color: #C9A96E; }

    /* КОНТЕЙНЕР ДЛЯ ТЕКСТА РОМАНА */
    .reader-container {
      flex: 1;
      width: 100%;
      max-width: 800px;
      margin: 90px auto 4rem;
      padding: 0 1.5rem;
    }

    .chapter-block {
      margin-bottom: 5rem;
      background: rgba(5, 5, 5, 0.75);
      padding: 2.5rem;
      border: 1px solid rgba(201, 169, 110, 0.08);
      box-shadow: 0 20px 50px rgba(0,0,0,0.9);
    }

    .chapter-title {
      font-family: 'Oranienbaum', serif;
      color: #C9A96E;
      font-size: 1.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 2rem;
      text-align: center;
      border-bottom: 1px solid rgba(201, 169, 110, 0.15);
      padding-bottom: 1rem;
    }

    /* СТИЛИ ДЛЯ ВНУТРЕННЕГО ТЕКСТА ГЛАВ */
    .novel-text {
      font-size: 1.15rem;
      margin-bottom: 1.2rem;
      text-align: justify;
      text-indent: 2rem;
    }

    /* Оформление встроенных картинок в главах */
    .img-inline {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 2.5rem auto;
      border: 1px solid rgba(201, 169, 110, 0.15);
    }

    /* СТИЛИ ДЛЯ СПАНОВ, КОТОРЫЕ ВЫЛЕЗАЛИ ТЕКСТОМ */
    .foreign {
      font-style: italic;
      color: #d4cba7;
    }

    .translation {
      font-size: 0.95rem;
      color: #8A7E6B;
      margin-left: 0.4rem;
    }

    @media(max-width: 768px) {
      .top-navbar { gap: 0.8rem; }
      .nav-link { font-size: 0.65rem; }
      .chapter-block { padding: 1.5rem; }
      .novel-text { text-align: left; font-size: 1.05rem; }
    }
  </style>
</head>
<body>

  <!-- Навигация -->
  <nav class="top-navbar">
    <a href="index.html" class="nav-link">Главная</a>
    <a href="reader.html" class="nav-link active">Читать</a>
    <a href="materials.html" class="nav-link">Архив</a>
    <a href="foreigners.html" class="nav-link">Cooperation</a>
    <a href="laboratory.html" class="nav-link">За кулисами</a>
  </nav>

  <!-- Основной контент (Вывод глав) -->
  <main class="reader-container">
    
    {% assign sorted_chapters = site.chapters | sort: 'idx' %}
    {% for ch in sorted_chapters %}
      <article class="chapter-block">
        <h2 class="chapter-title">{{ ch.title }}</h2>
        
        <!-- Фильтр markdownify заставит теги обрабатываться корректно -->
        <div class="chapter-content">
          {{ ch.content | markdownify }}
        </div>
      </article>
    {% endfor %}

  </main>

</body>
</html>
