<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дмитрий Ильин — литературное пространство</title>
<meta name="description" content="Литературное пространство Дмитрия Ильина.">
<style>
  * { box-sizing: border-box; }
  
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #000000;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Контейнер сцены */
  .scene-container {
    position: relative;
    display: inline-block;
    max-width: 100vw;
    max-height: 100vh;
  }

  /* Фоновое изображение стола без встроенных колб */
  .scene-image {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
    width: auto;
    height: auto;
    object-fit: contain;
    pointer-events: none;
  }

  /* Интерактивный портал-колба */
  .flask-portal {
    position: absolute;
    bottom: 9.5%;
    left: 71.3%;
    width: 4.4%;
    height: 15%;
    z-index: 999;
    cursor: pointer;
    text-decoration: none;
  }

  /* Общие правила для обоих слоев колбы */
  .flask-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    mix-blend-mode: screen; /* Убирает черный фон */
    transition: opacity 0.5s ease-in-out, filter 0.5s ease-in-out; /* Плавное перетекание */
  }

  /* По умолчанию затемненная колба видима, но мы ПРИОТКРЫВАЕМ её из темноты */
  .layer-shadowed {
    opacity: 1;
    filter: brightness(2.5) contrast(1.2); /* Сделайте цифру больше (например, 3.5), если нужно еще ярче в покое */
  }

  /* Яркая колба изначально скрыта */
  .layer-bright {
    opacity: 0;
  }

  /* При наведении слои плавно меняются местами */
  .flask-portal:hover .layer-shadowed,
  .flask-portal:focus-visible .layer-shadowed {
    opacity: 0;
  }

  .flask-portal:hover .layer-bright,
  .flask-portal:focus-visible .layer-bright {
    opacity: 1;
  }
</style>
</head>
<body>

  <div class="scene-container">
    
    <!-- Сцена без колбы -->
    <img src="images/invite colbe.png" alt="Дмитрий Ильин. Литературное пространство" class="scene-image">

    <!-- Интерактивная зона с двухслойной анимацией -->
    <a href="https://dmilinauthor.github.io/roman/index.html" class="flask-portal" title="Войти в пространство">
      <!-- Слой 1: Затемненная колба (теперь слегка подсвеченная фильтром) -->
      <img src="images/colba main shadowed.png" alt="" class="flask-layer layer-shadowed">
      
      <!-- Слой 2: Яркая золотая колба при наведении -->
      <img src="images/colba main bright.png" alt="Эмблема проекта" class="flask-layer layer-bright">
    </a>

  </div>

</body>
</html>
