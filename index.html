<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дмитрий Ильин — литературное пространство</title>
<meta name="description" content="Литературное пространство Дмитрия Ильина.">
<style>
  * { box-sizing: border-box; }
  
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #000000;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Контейнер сцены */
  .scene-container {
    position: relative;
    display: inline-block;
    max-width: 100vw;
    max-height: 100vh;
  }

  /* Фоновое изображение стола */
  .scene-image {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
    width: auto;
    height: auto;
    object-fit: contain;
    pointer-events: none;
  }

  /* Интерактивный портал-колба */
  .flask-portal {
    position: absolute;
    bottom: 9.5%;
    left: 71.3%;
    width: 4.4%;
    height: 15%;
    z-index: 999;
    cursor: pointer;
    text-decoration: none;
  }

  /* Яркая золотая колба — видна ВСЕГДА */
  .layer-bright {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    mix-blend-mode: screen; /* Идеально убирает черный фон файла */
    opacity: 1;             /* Колба всегда полностью видима */
    transition: filter 0.3s ease-in-out; /* Плавное включение свечения */
  }

  /* ЭФФЕКТ НАВЕДЕНИЯ: Сама колба начинает мягко светиться изнутри */
  .flask-portal:hover .layer-bright,
  .flask-portal:focus-visible .layer-bright {
    filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.9));
  }
</style>
</head>
<body>

  <div class="scene-container">
    
    <!-- Основной фон стола -->
    <img src="images/invite colbe.png" alt="Дмитрий Ильин. Литературное пространство" class="scene-image">

    <!-- Активная ссылка-колба -->
    <a href="https://dmilinauthor.github.io/roman/index.html" class="flask-portal" title="Войти в пространство">
      
      <!-- Золотая колба, которая всегда в кадре -->
      <img src="images/colba main bright.png" alt="Эмблема проекта" class="layer-bright">
      
    </a>

  </div>

</body>
</html>
