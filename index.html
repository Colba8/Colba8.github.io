<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дмитрий Ильин — литературное пространство</title>
<meta name="description" content="Литературное пространство Дмитрия Ильина.">
<style>
  :root {
    --void-black: #000000;
    --teal-glow: rgba(95, 228, 220, 0.55); /* Мягкое бирюзовое сияние Colba8 */
  }

  * { box-sizing: border-box; }
  
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: var(--void-black);
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Контейнер сцены */
  .theater-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    max-width: 100%;
    max-height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Фоновое изображение Invite.jpg */
  .background-scene {
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    opacity: 0;
    animation: fadeInScene 2s ease-out forwards;
  }

  /* Секретная зона СТРОГО на колбе рядом с машинкой */
  .secret-flask-zone {
    position: absolute;
    /* Координаты перенесены ближе к центру, прямо к правой стороне машинки */
    bottom: 14%;
    left: 70.8%; 
    width: 4.5%;
    height: 13%;
    
    border-radius: 40% 40% 25% 25%;
    cursor: pointer;
    text-decoration: none;
    z-index: 10;
    
    box-shadow: 0 0 0px transparent;
    background-color: rgba(95, 228, 220, 0);
    filter: blur(3px);
    transition: box-shadow 0.5s ease-in-out, background-color 0.5s ease-in-out;
  }

  /* Проявление сияния колбы при наведении */
  .secret-flask-zone:hover,
  .secret-flask-zone:focus-visible {
    outline: none;
    background-color: rgba(95, 228, 220, 0.05);
    box-shadow: 
      0 0 12px 3px var(--teal-glow),
      0 0 25px 6px rgba(19, 36, 48, 0.4);
  }

  @keyframes fadeInScene {
    to { opacity: 1; }
  }

  /* Коррекция координат под разные типы экранов, чтобы зона не съезжала с колбы */
  @media (min-aspect-ratio: 16/9) {
    .secret-flask-zone {
      left: calc(50% + 20.8%);
    }
  }
  @media (max-aspect-ratio: 16/9) {
    .secret-flask-zone {
      bottom: calc(50% - 36%);
      left: 70.8%;
    }
  }
</style>
</head>
<body>

  <div class="theater-container">
    
    <!-- Атмосферный фон -->
    <img src="images/Invite.jpg" alt="Дмитрий Ильин. Литературное пространство" class="background-scene">

    <!-- Исправленная скрытая зона на колбе у машинки -->
    <a href="https://dmilinauthor.github.io/roman/index.html" class="secret-flask-zone" title="Войти в пространство"></a>

  </div>

</body>
</html>
