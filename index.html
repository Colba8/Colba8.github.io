<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дмитрий Ильин — творческое пространство</title>
<meta name="description" content="Творческое пространство Дмитрия Ильина.">
<style>
  * { box-sizing: border-box; }
  
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #000000;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Контейнер сцены */
  .scene-container {
    position: relative;
    display: inline-block;
    max-width: 100vw;
    max-height: 100vh;
  }

  /* Фоновое изображение стола */
  .scene-image {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
    width: auto;
    height: auto;
    object-fit: contain;
    pointer-events: none;
  }

  /* Интерактивный портал-колба */
  .flask-portal {
    position: absolute;
    bottom: 9.5%;
    left: 71.3%;
    width: 4.4%;
    height: 15%;
    z-index: 999;
    cursor: pointer;
    text-decoration: none;
  }

  /* Новая золотая колба БЕЗ ФОНА — видна всегда */
  .layer-bright {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 1; 
    transition: filter 0.3s ease-in-out; /* Плавное свечение при наведении */
  }

  /* ЭФФЕКТ НАВЕДЕНИЯ: Мягкое золотое свечение по контуру прозрачной колбы */
  .flask-portal:hover .layer-bright,
  .flask-portal:focus-visible .layer-bright {
    filter: drop-shadow(0 0 14px rgba(212, 175, 55, 0.9));
  }
</style>
</head>
<body>

  <div class="scene-container">
    
    <!-- Основной фон стола -->
    <img src="images/invite colbe.png" alt="Дмитрий Ильин. Творческое пространство" class="scene-image">

    <!-- Активная ссылка-колба, ведущая на проект Второй звонок -->
    <a href="vtoroy-zvonok/index.html" class="flask-portal" title="Войти в пространство">
      
      <!-- Используем вашу новую колбу без фона -->
      <img src="images/colba main bright2.png" alt="Эмблема проекта" class="layer-bright">
      
    </a>

  </div>

</body>
</html>
