<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дмитрий Ильин — литературное пространство</title>
<meta name="description" content="Литературное пространство Дмитрия Ильина.">
<style>
  * { box-sizing: border-box; }
  
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #000000;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Контейнер сцены — держит пропорции подложки Invite.png */
  .scene-container {
    position: relative;
    display: inline-block;
    max-width: 100vw;
    max-height: 100vh;
  }

  /* Основное изображение стола с машинкой */
  .scene-image {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
    width: auto;
    height: auto;
    object-fit: contain;
    pointer-events: none;
  }

  /* Интерактивная ссылка-эмблема */
  .flask-emblem-link {
    position: absolute;
    /* Позиция строго на краю стола, справа от пишущей машинки */
    bottom: 9.5%;
    left: 71.3%;
    width: 4.4%;
    height: 15%;
    z-index: 999;
    cursor: pointer;
    text-decoration: none;
    
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Сама картинка эмблемы */
  .emblem-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    
    /* Слияние черного фона эмблемы с темнотой стола */
    mix-blend-mode: screen; 
    
    /* Изначально делаем эмблему сильно затемненной, приглушенной и сливающейся с тенью */
    opacity: 0.18;
    filter: brightness(0.4) contrast(0.9) blur(0.3px);
    
    /* Очень плавная кинематографическая анимация проявления (0.6 секунды) */
    transition: opacity 0.6s ease-in-out, filter 0.6s ease-in-out, transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
  }

  /* ЭФФЕКТ «ОЖИВЛЕНИЯ»: При наведении эмблема загорается своим истинным чистым светом */
  .flask-emblem-link:hover .emblem-img,
  .flask-emblem-link:focus-visible .emblem-img {
    opacity: 1; /* Возвращаем полную видимость */
    filter: brightness(1.2) contrast(1.1) drop-shadow(0 0 10px rgba(95, 228, 220, 0.5)); /* Яркое неоновое свечение */
    transform: scale(1.04); /* Легкий эффект приближения к зрителю */
  }
</style>
</head>
<body>

  <div class="scene-container">
    
    <img src="images/Invite.png" alt="Дмитрий Ильин. Литературное пространство" class="scene-image">

    <a href="https://dmilinauthor.github.io/roman/index.html" class="flask-emblem-link" title="Войти в пространство">
      <img src="images/colba8-logo.png" alt="Эмблема проекта" class="emblem-img">
    </a>

  </div>

</body>
</html>
