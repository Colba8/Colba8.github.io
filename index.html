<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дмитрий Ильин — литературное пространство</title>
<meta name="description" content="Литературное пространство Дмитрия Ильина.">
<style>
  * { box-sizing: border-box; }
  
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #000000;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Контейнер сцены подстраивается под размеры картинки */
  .scene-container {
    position: relative;
    display: inline-block;
    max-width: 100vw;
    max-height: 100vh;
  }

  /* Картинка (теперь строго .png) */
  .scene-image {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
    width: auto;
    height: auto;
    object-fit: contain;
    pointer-events: none; /* Защита от перетаскивания */
  }

  /* Точная интерактивная зона прямо поверх колбы справа от машинки */
  .secret-flask-zone {
    position: absolute;
    
    /* Процентные координаты от размеров самой картинки */
    bottom: 11.5%;
    left: 71.3%;
    width: 4.2%;
    height: 13.5%;
    
    border-radius: 45% 45% 20% 20%;
    cursor: pointer;
    text-decoration: none;
    z-index: 999;
    
    /* Эффект мягкого бирюзового свечения при наведении */
    box-shadow: 0 0 0px transparent;
    background-color: rgba(95, 228, 220, 0);
    filter: blur(2px);
    transition: box-shadow 0.4s ease-in-out, background-color 0.4s ease-in-out;
  }

  /* Подсветка колбы при наведении курсора */
  .secret-flask-zone:hover,
  .secret-flask-zone:focus-visible {
    outline: none;
    background-color: rgba(95, 228, 220, 0.08);
    box-shadow: 
      0 0 16px 4px rgba(95, 228, 220, 0.65),
      0 0 28px 8px rgba(19, 36, 48, 0.4);
  }
</style>
</head>
<body>

  <div class="scene-container">
    
    <img src="images/Invite.png" alt="Дмитрий Ильин. Литературное пространство" class="scene-image">

    <a href="https://dmilinauthor.github.io/roman/index.html" class="secret-flask-zone" title="Войти в пространство"></a>

  </div>

</body>
</html>
