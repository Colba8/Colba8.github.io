<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дмитрий Ильин — литературное пространство</title>
<meta name="description" content="Литературное пространство Дмитрия Ильина.">
<style>
  * { box-sizing: border-box; }
  
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #000000;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Контейнер сцены — строго держит пропорции оригинального изображения */
  .scene-container {
    position: relative;
    display: inline-block;
    max-width: 100vw;
    max-height: 100vh;
  }

  /* Фоновое изображение Invite.png из вашего репозитория */
  .scene-image {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
    width: auto;
    height: auto;
    object-fit: contain;
    pointer-events: none;
  }

  /* Интерактивная ссылка-контейнер, наложенная точно на область колбы */
  .flask-link {
    position: absolute;
    /* Координаты привязаны к геометрии стола справа от машинки */
    bottom: 9.2%;
    left: 71.1%;
    width: 4.8%;
    height: 15.5%;
    z-index: 999;
    cursor: pointer;
    text-decoration: none;
    display: block;
  }

  /* Векторный силуэт колбы Эрленмейера */
  .flask-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* Начинка колбы — изначально полностью прозрачная */
  .flask-fill {
    fill: rgba(95, 228, 220, 0);
    filter: blur(4px); /* Мягкое размытие для эффекта наполнения жидкостью/светом */
    transition: fill 0.6s ease-in-out;
  }

  /* Свечение стенок колбы */
  .flask-glow-line {
    stroke: rgba(95, 228, 220, 0);
    stroke-width: 2;
    fill: none;
    filter: blur(2px);
    transition: stroke 0.4s ease-in-out;
  }

  /* МАГИЯ НАВЕДЕНИЯ: Колба плавно наполняется бирюзовым сиянием */
  .flask-link:hover .flask-fill,
  .flask-link:focus-visible .flask-fill {
    fill: rgba(95, 228, 220, 0.28); /* Мягкий свет внутри стекла */
  }

  .flask-link:hover .flask-glow-line,
  .flask-link:focus-visible .flask-glow-line {
    stroke: rgba(95, 228, 220, 0.85); /* Четкий сияющий контур самого стекла */
  }
</style>
</head>
<body>

  <div class="scene-container">
    
    <img src="images/Invite.png" alt="Дмитрий Ильин. Литературное пространство" class="scene-image">

    <a href="https://dmilinauthor.github.io/roman/index.html" class="flask-link" title="Войти в пространство">
      <svg class="flask-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
        <polygon class="flask-fill" points="40,5 60,5 60,35 88,90 12,90 40,35" />
        <polygon class="flask-glow-line" points="40,5 60,5 60,35 88,90 12,90 40,35" />
      </svg>
    </a>

  </div>

</body>
</html>
