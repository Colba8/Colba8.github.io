<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дмитрий Ильин — литературное пространство</title>
<meta name="description" content="Литературное пространство Дмитрия Ильина.">
<style>
  * { box-sizing: border-box; }
  
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #000000;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Контейнер, который всегда занимает весь экран и центрирует контент */
  .scene-wrapper {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Картинка, которая гарантированно проявится и впишется в любые экраны */
  .scene-image {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    display: block;
    object-fit: contain;
    pointer-events: none; /* Защита от случайного перетаскивания мышью */
  }

  /* Секретная зона клика вокруг колбы — привязана к экрану пропорционально */
  .secret-flask-zone {
    position: absolute;
    
    /* Точные координаты колбы, которая стоит справа от печатной машинки */
    bottom: 15%;
    left: 70.5%;
    width: 5%;
    height: 13%;
    
    border-radius: 40% 40% 20% 20%;
    cursor: pointer;
    text-decoration: none;
    z-index: 999;
    
    /* Мягкое неоновое бирюзовое свечение при наведении */
    box-shadow: 0 0 0px transparent;
    background-color: rgba(95, 228, 220, 0);
    filter: blur(3px);
    transition: box-shadow 0.4s ease-in-out, background-color 0.4s ease-in-out;
  }

  /* Эффект сияния Colba8 при наведении */
  .secret-flask-zone:hover,
  .secret-flask-zone:focus-visible {
    outline: none;
    background-color: rgba(95, 228, 220, 0.05);
    box-shadow: 
      0 0 15px 4px rgba(95, 228, 220, 0.6),
      0 0 25px 6px rgba(19, 36, 48, 0.4);
  }

  /* Магическая адаптивность: удерживаем зону клика строго на колбе при изменении пропорций */
  @media (min-aspect-ratio: 16/9) {
    .secret-flask-zone {
      left: calc(50% + 20.5%);
    }
  }
  @media (max-aspect-ratio: 16/9) {
    .secret-flask-zone {
      bottom: calc(50% - 35%);
      left: 70.5%;
    }
  }
</style>
</head>
<body>

  <div class="scene-wrapper">
    
    <img src="images/Invite.jpg" alt="Дмитрий Ильин. Литературное пространство" class="scene-image">

    <a href="https://dmilinauthor.github.io/roman/index.html" class="secret-flask-zone" title="Войти в пространство"></a>

  </div>

</body>
</html>
