<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дмитрий Ильин — литературное пространство</title>
<meta name="description" content="Литературное пространство Дмитрия Ильина.">
<style>
  * { box-sizing: border-box; }
  
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #000000;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Контейнер сцены */
  .scene-container {
    position: relative;
    display: inline-block;
    max-width: 100vw;
    max-height: 100vh;
  }

  /* Фоновое изображение стола */
  .scene-image {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
    width: auto;
    height: auto;
    object-fit: contain;
    pointer-events: none;
  }

  /* Интерактивный портал: теперь это золотая рамка, которая видна ВСЕГДА */
  .flask-portal {
    position: absolute;
    bottom: 9.5%;
    left: 71.3%;
    width: 4.4%;
    height: 15%;
    z-index: 999;
    cursor: pointer;
    text-decoration: none;
    
    /* Рисуем вертикальный прямоугольник с закругленными краями */
    border: 2px solid #d4af37; /* Золотой цвет рамки */
    border-radius: 12px;       /* Скругление углов */
    box-shadow: 0 0 8px rgba(212, 175, 55, 0.3); /* Легкое золотистое свечение рамки */
    
    /* Чтобы колба внутри не вылезала за границы рамки при масштабировании */
    padding: 4px; 
    transition: box-shadow 0.3s ease-in-out;
  }

  /* При наведении рамка начинает слегка подсвечиваться ярче */
  .flask-portal:hover,
  .flask-portal:focus-visible {
    box-shadow: 0 0 15px rgba(212, 175, 55, 0.8);
  }

  /* Яркая золотая колба внутри рамки */
  .layer-bright {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    mix-blend-mode: screen; /* Убирает черный фон */
    
    /* Изначально колба полностью прозрачна */
    opacity: 0; 
    transition: opacity 0.4s ease-in-out; /* Плавное появление */
  }

  /* МАГИЯ: При наведении на рамку проявляется яркая колба */
  .flask-portal:hover .layer-bright,
  .flask-portal:focus-visible .layer-bright {
    opacity: 1;
  }
</style>
</head>
<body>

  <div class="scene-container">
    
    <!-- Сцена без колбы -->
    <img src="images/invite colbe.png" alt="Дмитрий Ильин. Литературное пространство" class="scene-image">

    <!-- Интерактивный золотой прямоугольник (всегда на экране) -->
    <a href="https://dmilinauthor.github.io/roman/index.html" class="flask-portal" title="Войти в пространство">
      
      <!-- Яркая золотая колба, которая плавно проявится внутри рамки при наведении -->
      <img src="images/colba main bright.png" alt="Эмблема проекта" class="layer-bright">
      
    </a>

  </div>

</body>
</html>
