<style>
/* ОБЩИЕ СТИЛИ */
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background-color: #050505;
  color: #e0d5b0;
  font-family: 'Literatta', Georgia, serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

/* СКВОЗНОЕ МЕНЮ */
.top-navbar {
  position: fixed;
  top: 0; left: 0; right: 0; height: 60px;
  background: #000000;
  border-bottom: 1px solid rgba(201, 169, 110, 0.15);
  display: flex; justify-content: center; align-items: center;
  gap: 1.8rem; z-index: 150; padding: 0 1rem;
}
.nav-link {
  color: #8A7E6B; font-size: 0.75rem; letter-spacing: 0.12em;
  text-transform: uppercase; text-decoration: none; transition: color 0.3s ease;
  cursor: pointer; background: transparent; border: none; font-family: inherit;
}
.nav-link:hover, .nav-link.active { color: #C9A96E; }
.nav-link.highlight { color: #C9A96E; font-weight: 500; }

/* ЗАДНИЙ ФОН СО СПОКОЙНЫМ ДВИЖЕНИЕМ ДЫМА */
.smoke-bg {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: url('images/62.png') no-repeat center center fixed;
  background-size: cover;
  opacity: 0.45;
  z-index: 1;
  pointer-events: none;
  /* Спокойная, очень медленная анимация движения дыма */
  animation: smokeDrift 45s ease-in-out infinite;
}

/* ГЛАВНЫЙ КОНТЕНТ */
.hero-container {
  position: relative;
  z-index: 10;
  max-width: 1000px;
  width: 100%;
  margin-top: 110px;
  padding: 0 1.5rem 5rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: fadeIn 2s ease-out;
}

/* ОБЛОЖКА-КОЛЛАЖ (СТАТИЧНАЯ) */
.cover-wrapper {
  position: relative;
  width: 100%;
  max-width: 850px;
  margin-bottom: 3.5rem;
  box-shadow: 0 20px 80px rgba(0,0,0,0.9);
  border: 1px solid rgba(201, 169, 110, 0.15);
}
.cover-img {
  display: block;
  width: 100%;
  height: auto;
}

/* КНОПКА ЧИТАТЬ */
.read-btn {
  display: inline-block;
  padding: 1.2rem 3.5rem;
  background: transparent;
  border: 1px solid #C9A96E;
  color: #C9A96E;
  font-family: 'Oranienbaum', Georgia, serif;
  font-size: 1.2rem;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  text-decoration: none;
  transition: all 0.4s ease;
  box-shadow: 0 5px 25px rgba(201, 169, 110, 0.05);
}
.read-btn:hover {
  background: #C9A96E;
  color: #050505;
  box-shadow: 0 10px 40px rgba(201, 169, 110, 0.2);
  transform: translateY(-2px);
}

/* СТИЛИ ДЛЯ КЛИКАБЕЛЬНОГО ТВОРЧЕСКОГО ПРОСТРАНСТВА ПОД ЗАГОЛОВКОМ */
.brand-sub {
  font-family: 'Literatta', Georgia, serif;
  font-size: 0.9rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: #8A7E6B;
  margin-top: 0.5rem;
  text-decoration: none;
  display: inline-block;
  transition: color 0.3s ease, border-bottom 0.3s ease;
  border-bottom: 1px dotted transparent;
}
.brand-sub:hover {
  color: #C9A96E;
  border-bottom-color: rgba(201, 169, 110, 0.4);
}

/* МОДАЛЬНОЕ ОКНО КОНТАКТОВ */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(11, 10, 8, 0.85);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 200;
}
.modal-overlay.show { opacity: 1; pointer-events: auto; }

.modal-card { 
  background: #0b0a08; 
  border: 1px solid rgba(201, 169, 110, 0.3); 
  padding: 2.5rem; 
  max-width: 450px; 
  width: 90%; 
  position: relative;
  box-shadow: 0 20px 50px rgba(0,0,0,0.9);
}
.modal-card h2 {
  font-family: 'Oranienbaum', serif;
  color: #C9A96E;
  font-size: 1.6rem;
  margin-bottom: 1.5rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.modal-close { position: absolute; top: 1rem; right: 1rem; background: transparent; border: none; color: #8A7E6B; font-size: 1.5rem; cursor: pointer; transition: color 0.3s; }
.modal-close:hover { color: #C9A96E; }

.feedback-form { display: flex; flex-direction: column; gap: 1.2rem; }
.feedback-form input, .feedback-form textarea { 
  background: #11100e !important; 
  border: 1px solid rgba(201, 169, 110, 0.25); 
  color: #e0d5b0 !important; 
  padding: 0.9rem; 
  font-family: inherit;
  font-size: 0.95rem;
  outline: none;
  -webkit-text-fill-color: #e0d5b0 !important;
}
.feedback-form input:focus, .feedback-form textarea:focus {
  border-color: #C9A96E;
}

/* Сброс автозаполнения браузера */
.feedback-form input:-webkit-autofill,
.feedback-form input:-webkit-autofill:hover, 
.feedback-form input:-webkit-autofill:focus,
.feedback-form textarea:-webkit-autofill,
.feedback-form textarea:-webkit-autofill:hover,
.feedback-form textarea:-webkit-autofill:focus {
  -webkit-text-fill-color: #e0d5b0 !important;
  -webkit-box-shadow: 0 0 0px 1000px #11100e inset !important;
  transition: background-color 5000s ease-in-out 0s;
}

.form-submit { 
  padding: 0.9rem; 
  background: transparent; 
  border: 1px solid #C9A96E; 
  color: #C9A96E; 
  text-transform: uppercase; 
  letter-spacing: 0.1em;
  font-size: 0.85rem;
  cursor: pointer; 
  transition: 0.3s; 
}
.form-submit:hover { background: #C9A96E; color: #0b0a08; }

/* Спокойное покачивание дыма */
@keyframes smokeDrift {
  0% { transform: scale(1) translate(0, 0); }
  50% { transform: scale(1.06) translate(10px, -8px); }
  100% { transform: scale(1) translate(0, 0); }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 768px) {
  .hero-container { margin-top: 90px; }
  .cover-wrapper { margin-bottom: 2.5rem; }
  .read-btn { padding: 1rem 2.5rem; font-size: 1.1rem; width: 100%; text-align: center; }
}
</style>

<div class="modal-overlay" id="contactModal" onclick="if(event.target === this) toggleModal(false)">
  <div class="modal-card">
    <button class="modal-close" onclick="toggleModal(false)">✕</button>
    <h2>Связь с автором</h2>
    <form class="feedback-form" action="https://formspree.io/f/mgojzbba" method="POST">
      <input type="text" name="name" placeholder="Ваш позывной" required>
      <input type="email" name="email" placeholder="Ваша почта" required>
      <textarea name="message" placeholder="Донесение" required></textarea>
      <button type="submit" class="form-submit">Передать</button>
    </form>
  </div>
</div>

<script>
function toggleModal(show) {
  document.getElementById('contactModal').classList.toggle('show', show);
}
</script>
