<body>

<nav class="top-navbar">
  <a href="/index.html" class="nav-logo" title="Главная страница">
    <img src="/tom1/images/00.png" alt="Театр теней">
  </a>
  <span class="nav-divider"></span>

  <aside class="sidebar">
    <div class="sb-title">Второй звонок</div>

  <main class="content">

          Единый номер депонирования литературного произведения в реестре: 226061100096.
        </p>
        <img src="/tom1/images/00.png" alt="Колба" class="copyright-flask">
      </div>

    </article>
  </main>
</div>

<div class="reader-controls">
  <span id="bm-status"></span>
  <button class="btn-control" onclick="saveBookmark()">🔖 Закладка</button>
  <button class="btn-control" onclick="goToBookmark()">📍 К закладке</button>
</div>

<script>
var FILES = [
  'chapters/01.html',
  'chapters/02.html',
  'chapters/03.html',
  'chapters/04.html',
  'chapters/05.html',
  'chapters/06.html',
  'chapters/07.html',
  'chapters/08.html',
  'chapters/09.html',
  'chapters/10.html',
  'chapters/11.html',
  'chapters/12.html',
  'chapters/13.html',
  'chapters/14.html',
  'chapters/15.html',
  'chapters/16.html',
  'chapters/17.html',
  'chapters/18.html',
  'chapters/19.html',
  'chapters/20.html',
  'chapters/21.html',
  'chapters/22.html',
  'chapters/23.html',
  'chapters/24.html',
  'chapters/25.html',
  'chapters/26.html',
  'chapters/27.html',
  'chapters/28.html'
];

var TITLES = [
  'Пролог', 'НОЧЬ', 'УТРО', 'ТРАВИАТА', 'ВЫСТРЕЛ', 'ПЛАН «А»', 'ИНСПЕКТОР',
  'ЛИССАБОН', 'ПЕРЕГОН', 'ФОРМАЛЬНОСТИ', 'МИЛАН', 'БАЗА', 'МАЛЬТА', 'ВЭСТ-ЭНД',
  'Дневник Мастера', 'МАСТЕРСКАЯ', 'ДОСЬЕ', 'ПРИГЛАШЕНИЕ', 'ОХОТА',
  'НОЧЬ ПОСЛЕ ОХОТЫ', 'В ЖЕНЕВУ', 'ВАЛЬТЕР', 'КЛЮЧ', 'ПОРТНОЙ', 'ШИРМА',
  'ПОЕЗД В ЛЮЦЕРН', 'ПАПКА', 'ЭПИЛОГ'
];

(function () {
  var book = document.getElementById('book');
  var toc = document.getElementById('toc');
  var i = 0;
  
  function next() {
    if (i >= FILES.length) return;
    var f = FILES[i], t = TITLES[i]; i++;
    
    fetch(f).then(function (r) {
      if (!r.ok) throw new Error(f);
      return r.text();
    }).then(function (html) {
      html = html.replace(/^\ufeff?---[\s\S]*?---\s*\n/, '');
      html = html.replace(/(?:\.\.\/)?images\//g, '/tom1/images/');
      
      var section = document.createElement('section');
      section.id = 'ch-' + (i - 1);
      section.style.marginBottom = '4rem';
      section.style.scrollMarginTop = '80px';

      if (i - 1 !== 0) {
        var h2 = document.createElement('h2');
        h2.className = 'chapter-title';
        h2.textContent = t;
        section.appendChild(h2);
      }
      
      var div = document.createElement('div');
      div.className = 'chapter-body';
      div.innerHTML = html;
      
      var firstP = div.querySelector('p');
      if (firstP) {
        var txt = firstP.textContent.trim();
        if (/,\s*(19[4-6][0-9]|194[6-8])/.test(txt)) {
          firstP.className = 'subhead';
        }
      }
      
      section.appendChild(div);
      book.appendChild(section);
      
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.className = 'sb-item';
      a.href = '#ch-' + (i - 1);
      a.textContent = t;
      
      a.onclick = function(e) {
        e.preventDefault();
        document.querySelectorAll('.sb-item').forEach(function(x){x.classList.remove('active')});
        a.classList.add('active');
        
        var targetId = a.getAttribute('href').substring(1);
        var target = document.getElementById(targetId);
        if (target) {
          var offset = target.offsetTop - 80; 
          window.scrollTo({ top: offset, behavior: 'smooth' });
        }
      };
      
      li.appendChild(a);
      toc.appendChild(li);
      
      next();
    }).catch(function () {
      var p = document.createElement('p');
      p.className = 'load-error';
      p.textContent = 'Глава не загрузилась: ' + f;
      book.appendChild(p);
      next();
    });
  }
  next();
})();

function saveBookmark() {
  localStorage.setItem('tom1_bm', String(window.scrollY));
  document.getElementById('bm-status').textContent = 'закладка сохранена';
  setTimeout(function(){document.getElementById('bm-status').textContent=''}, 2000);
}

function goToBookmark() {
  var y = parseInt(localStorage.getItem('tom1_bm') || '0', 10);
  window.scrollTo({ top: y, behavior: 'smooth' });
}
</script>

</body>
