<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Второй звонок — Читальный зал</title>

<link rel="icon" href="images/51.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Literatta:opsz,wght@6..72,300;6..72,400;6..72,500;6..72,600;6..72,700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}

body{
  background:#0b0a08 url('images/69.png') no-repeat center center fixed;
  background-size: cover;
  color:#e0d5b0;
  font-family:'Literatta', Georgia, serif;
  min-height:100vh;
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #000000; }
::-webkit-scrollbar-thumb { background: #C9A96E; border-radius: 3px; }

.top-navbar {
  position: fixed;
  top: 0; left: 0; right: 0; height: 60px;
  background: #000000;
  border-bottom: 1px solid rgba(201, 169, 110, 0.2);
  display: flex; justify-content: center; align-items: center;
  gap: 1.8rem; z-index: 1000;
}
.nav-link {
  color: #8A7E6B; font-size: 0.75rem; letter-spacing: 0.12em;
  text-transform: uppercase; text-decoration: none;
}
.nav-link:hover, .nav-link.active { color: #C9A96E; }

.main-layout {
  display: flex;
  margin-top: 60px;
}

.sidebar {
  width: 260px;
  background: rgba(11, 10, 8, 0.95);
  border-right: 1px solid rgba(201, 169, 110, 0.15);
  position: fixed;
  top: 60px; bottom: 0;
  overflow-y: auto;
  padding: 2rem 1rem;
  z-index: 100;
}
.sb-title {
  font-family: 'Oranienbaum', serif; color: #C9A96E;
  font-size: 1.2rem; margin-bottom: 1.5rem; padding-bottom: 0.5rem;
  border-bottom: 1px solid rgba(201, 169, 110, 0.2);
}
.sb-item {
  display: block; width: 100%; padding: 0.6rem 0;
  background: transparent; border: none;
  color: #8A7E6B; text-align: left; cursor: pointer;
  font-family: inherit; font-size: 0.85rem;
  text-decoration: none;
}
.sb-item:hover, .sb-item.active { color: #C9A96E; }

.content {
  flex: 1;
  margin-left: 260px;
  padding: 2rem 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.content-inner {
  max-width: 1050px;
  width: 92%;
  background: #0b0a08;
  padding: 4rem 4.5rem;
  box-shadow: 0 0 80px #000;
  border: 1px solid rgba(201, 169, 110, 0.1);
}

.chapter-title {
  font-family: 'Oranienbaum', serif; color: #C9A96E;
  font-size: 2rem; text-align: center; margin: 3rem 0;
  text-transform: uppercase; letter-spacing: 0.1em;
  scroll-margin-top: 80px; /* ИСПРАВЛЕНИЕ: заголовок не прячется под меню */
}

.novel-text, .chapter-body p {
  font-size: 1.35rem; line-height: 1.85; margin-bottom: 1.8rem;
  font-weight: 300; text-align: justify; 
  text-indent: 0 !important;
  color: #e0d5b0;
}

.img-inline, img {
  max-width: 100%; height: auto;
  margin: 3rem auto; display: block;
  border: 1px solid rgba(201, 169, 110, 0.2);
  box-shadow: 0 10px 30px rgba(0,0,0,0.8);
}

.document {
  background: #e4dcc4 !important;
  color: #1a1713 !important;
  font-family: 'Courier Prime', 'Courier New', monospace !important;
  padding: 3rem; 
  margin: 3rem 0;
  border-left: 5px solid #C9A96E;
  box-shadow: 0 5px 15px rgba(0,0,0,0.5), 0 20px 40px rgba(0,0,0,0.8);
  border-radius: 2px;
}

.document p {
  color: #1a1713 !important;
  font-family: 'Courier Prime', 'Courier New', monospace !important;
  font-size: 1.1rem !important;
  line-height: 1.5 !important;
  text-indent: 0 !important;
  text-align: left !important;
  margin-bottom: 1.2rem;
  letter-spacing: -0.02em;
}

.foreign {
  font-style: italic;
  color: #e0d5b0;
}

.translation {
  font-size: 1.05rem;
  color: #8A7E6B;
  margin-left: 0.4rem;
  font-style: normal;
}

.reader-controls {
  position: fixed;
  bottom: 2rem;
  right: 2rem;
  display: flex;
  gap: 0.6rem;
  z-index: 1000;
}
.btn-control {
  background: rgba(0,0,0,0.85);
  border: 1px solid #C9A96E;
  color: #C9A96E;
  font-family: inherit;
  font-size: 0.75rem;
  letter-spacing: 0.15em;
  padding: 0.5rem 1rem;
  cursor: pointer;
  transition: all .3s;
}
.btn-control:hover {
  background: #C9A96E;
  color: #0b0a08;
}
#bm-status {
  position: fixed;
  bottom: 2.5rem;
  right: 14rem;
  font-size: 0.75rem;
  color: #8A7E6B;
  letter-spacing: 0.1em;
}

.load-error {
  color: #a05555;
  border: 1px dashed #a05555;
  padding: 0.8rem;
  margin: 1rem 0;
}

@media(max-width: 950px) {
  .sidebar { display: none; }
  .content { margin-left: 0; }
  .content-inner { padding: 2rem 1.2rem; width: 100%; }
  .document { padding: 1.5rem; }
  .novel-text, .chapter-body p { text-align: left; text-indent: 0 !important; font-size: 1.15rem; }
  .reader-controls { bottom: 1rem; right: 1rem; }
  #bm-status { right: auto; left: 1rem; bottom: 1.5rem; }
}
</style>
</head>
<body>

<nav class="top-navbar">
  <a href="index.html" class="nav-link">Главная</a>
  <a href="reader.html" class="nav-link active">Читать</a>
  <a href="materials.html" class="nav-link">Архив</a>
  <a href="foreigners.html" class="nav-link">Cooperation</a>
  <a href="laboratory.html" class="nav-link">За кулисами</a>
  <a href="contacts.html" class="nav-link">Контакты</a>
</nav>

<div class="main-layout">
  <aside class="sidebar">
    <div class="sb-title">Второй звонок</div>
    <ul class="sb-list" id="toc"></ul>
  </aside>

  <main class="content">
    <article class="content-inner">
      <div id="book"></div>
    </article>
  </main>
</div>

<div class="reader-controls">
  <span id="bm-status"></span>
  <button class="btn-control" onclick="saveBookmark()"> Закладка</button>
  <button class="btn-control" onclick="goToBookmark()"> К закладке</button>
</div>

<script>
// Файлы глав в порядке возрастания (01.html — 28.html)
var FILES = [
  'chapters/01.html',
  'chapters/02.html',
  'chapters/03.html',
  'chapters/04.html',
  'chapters/05.html',
  'chapters/06.html',
  'chapters/07.html',
  'chapters/08.html',
  'chapters/09.html',
  'chapters/10.html',
  'chapters/11.html',
  'chapters/12.html',
  'chapters/13.html',
  'chapters/14.html',
  'chapters/15.html',
  'chapters/16.html',
  'chapters/17.html',
  'chapters/18.html',
  'chapters/19.html',
  'chapters/20.html',
  'chapters/21.html',
  'chapters/22.html',
  'chapters/23.html',
  'chapters/24.html',
  'chapters/25.html',
  'chapters/26.html',
  'chapters/27.html',
  'chapters/28.html'
];

// Названия глав (строго по порядку, соответствуют индексам 01–28)
var TITLES = [
  'Пролог',
  'НОЧЬ',
  'УТРО',
  'ТРАВИАТА',
  'ВЫСТРЕЛ',
  'ПЛАН «А»',
  'ИНСПЕКТОР',
  'ЛИССАБОН',
  'ПЕРЕГОН',
  'ФОРМАЛЬНОСТИ',
  'МИЛАН',
  'БАЗА',
  'МАЛЬТА',
  'ВЭСТ-ЭНД',
  'Дневник Мастера',
  'МАСТЕРСКАЯ',
  'ДОСЬЕ',
  'ПРИГЛАШЕНИЕ',
  'ОХОТА',
  'НОЧЬ ПОСЛЕ ОХОТЫ',
  'В ЖЕНЕВУ',
  'ВАЛЬТЕР',
  'КЛЮЧ',
  'ПОРТНОЙ',
  'ШИРМА',
  'ПОЕЗД В ЛЮЦЕРН',
  'ПАПКА',
  'ЭПИЛОГ'
];

(function () {
  var book = document.getElementById('book');
  var toc = document.getElementById('toc');
  var i = 0;
  function next() {
    if (i >= FILES.length) return;
    var f = FILES[i], t = TITLES[i]; i++;
    fetch(f).then(function (r) {
      if (!r.ok) throw new Error(f);
      return r.text();
    }).then(function (html) {
      html = html.replace(/^\ufeff?---[\s\S]*?---\s*\n/, '');
      html = html.replace(/\.\.\/images\//g, 'images/');
      var section = document.createElement('section');
      section.id = 'ch-' + (i - 1);
      section.style.marginBottom = '5rem';
      var h2 = document.createElement('h2');
      h2.className = 'chapter-title';
      h2.textContent = t;
      section.appendChild(h2);
      var div = document.createElement('div');
      div.className = 'chapter-body';
      div.innerHTML = html;
      section.appendChild(div);
      book.appendChild(section);
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.className = 'sb-item';
      a.href = '#ch-' + (i - 1);
      a.textContent = t;
      a.onclick = function(e) {
        document.querySelectorAll('.sb-item').forEach(function(x){x.classList.remove('active')});
        a.classList.add('active');
      };
      li.appendChild(a);
      toc.appendChild(li);
      next();
    }).catch(function () {
      var p = document.createElement('p');
      p.className = 'load-error';
      p.textContent = 'Глава не загрузилась: ' + f;
      book.appendChild(p);
      next();
    });
  }
  next();
})();

function saveBookmark() {
  localStorage.setItem('tom1_bm', String(window.scrollY));
  document.getElementById('bm-status').textContent = 'закладка сохранена';
  setTimeout(function(){document.getElementById('bm-status').textContent=''}, 2000);
}
function goToBookmark() {
  var y = parseInt(localStorage.getItem('tom1_bm') || '0', 10);
  window.scrollTo({ top: y, behavior: 'smooth' });
}
</script>

</body>
</html>
