<p class="novel-text">Валлетта, 15 декабря 1946 года, 12:00. (аэродром Лука)</p>

<p class="novel-text">Тепло. Солнце. Язык сам переключился на тот, на котором он думал, когда был молодым.</p>

<p class="novel-text"><span class="foreign">«Tranquilo, coño. No te muevas.»</span> <span class="translation">[Тихо, твою мать. Не шевелись.]</span> — голос Ассо[...]
