<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Том I: Второй звонок — Дмитрий Ильин. Литературный проект «Театр теней»</title>
  <link rel="icon" href="/images/51.png" type="image/png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: #050505;
      color: #e0d5b0;
      font-family: 'Georgia', 'Times New Roman', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    .poster-container {
      position: relative;
      width: 100vw;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .poster-img {
      max-width: 80vw;
      max-height: 75vh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    /* ЦЕНТРАЛЬНОЕ МЕНЮ НАВИГАЦИИ */
    .top-nav {
      position: absolute;
      top: 1.5rem;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 2.5rem;
      z-index: 100;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .top-nav a {
      color: #C5A059;
      text-decoration: none;
      transition: color 0.3s ease;
      padding: 0.5rem 1rem;
    }

    .top-nav a:hover {
      color: #f0d59e;
    }

    .bottom-action-container {
      position: absolute;
      bottom: 9.5%;
      left: 30.5%;
      transform: translateX(-50%);
      z-index: 999;
    }

    .enter-btn {
      display: inline-block;
      text-decoration: none;
      background: rgba(10, 9, 7, 0.92);
      border: 1.5px solid #C5A059;
      color: #C5A059;
      padding: 0.5rem 1.8rem;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      transition: all 0.35s ease;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
    }

    .enter-btn:hover {
      background: #C5A059;
      color: #050505;
      box-shadow: 0 0 20px rgba(197, 160, 89, 0.6);
    }

    .stamp-flask {
      position: absolute;
      right: 2.5%;
      bottom: 5%;
      width: 90px;
      height: auto;
      display: block;
      opacity: 0.95;
      filter: drop-shadow(0 0 10px rgba(197, 160, 89, 0.35));
      pointer-events: none;
      z-index: 50;
    }

    @media (max-width: 768px) {
      .top-nav { 
        top: 1rem; 
        gap: 1.2rem;
        font-size: 0.7rem;
      }
      .bottom-action-container { bottom: 8%; }
      .stamp-flask { width: 60px; right: 1.2rem; bottom: 3%; }
    }
  </style>
</head>
<body>

  <div class="poster-container">

    <!-- ЦЕНТРАЛЬНОЕ МЕНЮ НАВИГАЦИИ -->
    <nav class="top-nav">
      <a href="/index.html">Главная</a>
      <a href="/tom1/index.html">Второй звонок</a>
      <a href="/tom2/index.html">Одуванчики</a>
      <a href="/behind/index.html">За кулисами</a>
      <a href="/cooperation.html">Сотрудничество</a>
      <a href="/contacts.html">Контакты</a>
    </nav>

    <!-- ПОСТЕР -->
    <img src="/tom1/images/64.png" alt="Том I: Второй звонок" class="poster-img">

    <!-- КНОПКА "ВХОД" -->
    <div class="bottom-action-container">
      <a href="/tom1/reader.html" class="enter-btn">ВХОД</a>
    </div>

    <!-- КОЛБА-ПЕЧАТЬ ПРОЕКТА -->
    <img src="/tom1/images/00.png" alt="Театр теней" class="stamp-flask">

  </div>

</body>
</html>
